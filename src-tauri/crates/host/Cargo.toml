[package]
name = "kubecove-host"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"

[features]
default = []
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:kubecove-live",
    "kubecove-kube/desktop",
    "remote-client",
]
remote-client = [
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:kubecove-live",
    "dep:kubecove-gitops",
    "dep:axum",
    "dep:base64",
    "dep:getrandom",
    "dep:open",
    "dep:ring",
    "dep:subtle",
]
bench-support = ["desktop"]

[dependencies]
kubecove-models = { path = "../models" }
kubecove-kube = { path = "../kube", default-features = false }
kubecove-live = { path = "../live", optional = true }
kubecove-gitops = { path = "../gitops", optional = true }
chrono = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sysinfo = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["query"] }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
open = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

[lints]
workspace = true
