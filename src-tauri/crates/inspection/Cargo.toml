[package]
name = "kubecove-inspection"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
description = "KubeCove resource inspection, RBAC and guarded Kubernetes operations"

[features]
default = []
desktop = ["dep:tauri", "kubecove-kube/desktop"]
bench-support = ["desktop", "kubecove-kube/bench-support"]

[dependencies]
kubecove-models = { path = "../models" }
kubecove-kube = { path = "../kube" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
serde_yaml = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tauri = { workspace = true, optional = true }

[dev-dependencies]
kubecove-kube = { path = "../kube", features = ["test-support"] }
http = { workspace = true }
tower = { workspace = true }
tower-test = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
