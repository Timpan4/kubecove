[package]
name = "kubecove-kube"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "KubeCove Kubernetes clients, session scope, shared metadata and caches"

[features]
# Recover credential plugin paths for desktop launches.
credential-plugin-path = []
bench-support = []
# Read only the pinned kubeconfig in the native E2E flavor (ADR 0035).
pinned-kubeconfig = []
# Exposes the fixed-client test adapter for other crates' tests.
test-support = []

[dependencies]
kubecove-models = { path = "../models" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tower-test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
