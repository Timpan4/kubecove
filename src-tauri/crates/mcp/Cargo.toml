[package]
name = "kubecove-mcp"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "KubeCove read-only MCP tools and their HTTP endpoint (ADR 0028)"

[features]
default = []
desktop = [
    "kubecove-kube/desktop", "kubecove-inspection/desktop", "kubecove-live/desktop",
    "kubecove-gitops/desktop", "loopback",
]
# The desktop app's own loopback listener; the server mounts the endpoint in its router.
loopback = ["dep:axum"]

[dependencies]
kubecove-models = { path = "../models" }
kubecove-kube = { path = "../kube" }
kubecove-inspection = { path = "../inspection" }
kubecove-live = { path = "../live" }
kubecove-gitops = { path = "../gitops" }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
tower-service = { workspace = true }
bytes = { workspace = true }
subtle = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
kubecove-kube = { path = "../kube", features = ["test-support"] }
kube = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
