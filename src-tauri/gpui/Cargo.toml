[workspace]
resolver = "2"

[package]
name = "kubecove-gpui"
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets", "tree-sitter-yaml"] }
kubecove = { path = "..", default-features = false }
kubecove-host = { path = "../crates/host", features = ["remote-client"] }
rfd = "=0.17.2"
dirs = "=7.0.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
semver = "=1.0.28"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] }
similar = "=3.2.1"
# GPUI Kit has no VT terminal; parse remote output without starting a local PTY.
vt100 = "=0.18.1"
chrono = "=0.4.45"
serde_json = "=1.0.154"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# Both are already in the lockfile through the backend. `regex` ports the web
# log-structure patterns; `serde` reads JSON log fields in document order.
regex = "=1.13.1"
serde = "=1.0.229"
# The backend's YAML crate, which the Argo CD tab uses to read the Application
# spec and print comparison documents, as `yaml` does in the web.
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }

[dev-dependencies]
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"
gpui-kit = { version = "=0.9.0", default-features = false, features = ["test-support"] }
serde = { version = "=1.0.229", features = ["derive"] }

[[test]]
name = "visual"
harness = false

# Dependency debug info made up 846 MB of the 1 GB visual test binary, and
# linking it peaked at 4.7 GB RSS. KubeCove's own crates keep full debug info.
[profile.dev.package."*"]
debug = false

[profile.dev.package.kubecove]
debug = true
