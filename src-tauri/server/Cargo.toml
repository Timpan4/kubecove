[package]
name = "kubecove-server"
version = "0.12.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
description = "Authenticated single-user headless KubeCove host"

[features]
default = ["web-ui"]
web-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
kubecove = { path = "..", default-features = false }
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
futures-util = "=0.3.34"
tokio-util = "=0.7.19"
getrandom = "=0.4.3"
base64 = "=0.23.1"
subtle = "=2.6.1"
rust-embed = { version = "=8.13.0", features = ["debug-embed"], optional = true }
mime_guess = { version = "=2.0.5", optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
openidconnect = { version = "=4.0.1", default-features = false }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.53.2", features = ["test-util"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
