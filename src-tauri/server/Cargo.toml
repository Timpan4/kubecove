# A separate workspace prevents desktop features from unifying into server builds.
[workspace]
resolver = "2"

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[package]
name = "kubecove-server"
version = "0.14.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "Authenticated single-user headless KubeCove host"

[features]
default = ["web-ui"]
web-ui = ["dep:rust-embed", "dep:mime_guess", "dep:brotli", "dep:flate2"]

[dependencies]
kubecove = { path = "..", default-features = false }
kubecove-mcp = { path = "../crates/mcp" }
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
futures-util = "=0.3.34"
tokio-util = "=0.7.20"
getrandom = "=0.4.3"
base64 = "=0.23.1"
subtle = "=2.6.1"
rust-embed = { version = "=8.13.0", features = ["debug-embed"], optional = true }
mime_guess = { version = "=2.0.5", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
openidconnect = { version = "=4.1.0", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
prometheus-client = "=0.25.2"
# Matches the backend workspace's pin.
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
brotli = "=9.1.1"
flate2 = "=1.1.11"

[build-dependencies]
brotli = { version = "=9.1.1", optional = true }
flate2 = { version = "=1.1.11", optional = true }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
