name: Documentation issue
description: Report an error, gap, or unclear KubeCove documentation page.
title: "docs: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, kubeconfig contents, tokens, customer data, or sensitive diagnostics. Report suspected vulnerabilities through [SECURITY.md](https://github.com/Timpan4/kubecove/blob/main/SECURITY.md).
  - type: input
    id: page_url
    attributes:
      label: Documentation page URL
      description: Link to page needing correction.
      placeholder: https://github.com/Timpan4/kubecove/wiki/Home
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe error, gap, or unclear guidance.
    validations:
      required: true
  - type: textarea
    id: expected_correction
    attributes:
      label: Expected correction
      description: State correct or clearer documentation.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: KubeCove version (optional)
      description: Include only if issue changes by version.
    validations:
      required: false
  - type: input
    id: operating_system
    attributes:
      label: Operating system (optional)
      description: Include OS and version if relevant.
    validations:
      required: false
