name: Parity

# The shared Svelte and GPUI acceptance scenarios (e2e/parity/README.md), split across
# PARITY_SUITE_SHARD jobs. PR drivers use separate runners to avoid cargo contention. Both
# events run the full suite; main also records the coverage map that local PARITY_CHANGED runs
# read. Change selection fell back to the full suite on every recent pull request, because
# each one changed harness files that coverage cannot see.
#
# The topology spike harness renders a 4,000-node map and took 4 to 7 minutes of one web
# page, so it runs in a job of its own instead of setting one shard's minimum time.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request-web:
    name: Parity web (pull request)
    # Release PRs change only versions and changelogs, so they skip it as in ci.yml.
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/parity-suite.yml
    # Pull request jobs restore main's caches and save none, so every pull request also
    # exercises the read-only cache access that the main shards below depend on.
    cache-mode: read
    with:
      shard: ${{ matrix.shard }}
      shards: 4
      driver: web
      exclude: settings-diagnostics.topology-spike-harness

  pull-request-spike:
    name: Parity (pull request)
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    strategy:
      fail-fast: false
      matrix:
        driver: [web, gpui]
    uses: ./.github/workflows/parity-suite.yml
    cache-mode: read
    with:
      shard: 0
      shards: 1
      driver: ${{ matrix.driver }}
      prefix: settings-diagnostics.topology-spike-harness

  # With two shards a warm GPUI job took 326 to 359 s: about 100 s to build the test and
  # 150 s of scenarios (run 43322953853). A third shard shortens the scenario share.
  pull-request-gpui:
    name: Parity GPUI (pull request)
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    uses: ./.github/workflows/parity-suite.yml
    cache-mode: read
    with:
      shard: ${{ matrix.shard }}
      shards: 3
      driver: gpui
      exclude: settings-diagnostics.topology-spike-harness

  # One check name a ruleset can require; the matrix jobs carry their shard in their names.
  # Release PRs pass only when the parity jobs were deliberately skipped, as in ci.yml.
  pull-request-result:
    name: Parity result
    needs:
      - pull-request-web
      - pull-request-gpui
      - pull-request-spike
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify parity jobs
        env:
          WEB_RESULT: ${{ needs.pull-request-web.result }}
          GPUI_RESULT: ${{ needs.pull-request-gpui.result }}
          SPIKE_RESULT: ${{ needs.pull-request-spike.result }}
          RELEASE_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          echo "Web: ${WEB_RESULT}; GPUI: ${GPUI_RESULT}; topology spike: ${SPIKE_RESULT}"
          expected=success
          if [[ "${RELEASE_PR}" == "true" ]]; then expected=skipped; fi
          test "${WEB_RESULT}" = "${expected}"
          test "${GPUI_RESULT}" = "${expected}"
          test "${SPIKE_RESULT}" = "${expected}"

      - name: Checkout
        if: ${{ needs.pull-request-web.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        if: ${{ needs.pull-request-web.result == 'success' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # Every attempt, because "Re-run failed jobs" does not run the passed shards again:
      # their reports stay in the earlier attempt. merge-reports.ts judges each shard by its
      # newest attempt.
      - name: Download driver reports
        if: ${{ needs.pull-request-web.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parity-pull_request-*
          path: parity-reports

      - name: Validate merged driver reports
        if: ${{ needs.pull-request-web.result == 'success' }}
        run: bun e2e/parity/merge-reports.ts parity-reports

  main:
    name: Parity (main)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/parity-suite.yml
    # The four shards and the spike job build the same instrumented binary under one cache
    # key. The spike job saves it and these restore only.
    cache-mode: read
    with:
      shard: ${{ matrix.shard }}
      shards: 4
      coverage: true
      exclude: settings-diagnostics.topology-spike-harness

  # Saves the instrumented build cache that the four shards above restore.
  main-spike:
    name: Parity (main)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/parity-suite.yml
    with:
      shard: 0
      shards: 1
      coverage: true
      prefix: settings-diagnostics.topology-spike-harness

  # The main shards build an instrumented binary, so this seeds the uninstrumented build
  # cache that pull requests restore.
  main-build-cache:
    name: Parity build cache (main)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/parity-suite.yml
    with:
      shard: 0
      shards: 1
      build-only: true

  coverage-map:
    name: Parity coverage map (main)
    needs:
      - main
      - main-spike
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Download shard coverage maps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parity-coverage-shard-*
          path: shard-maps

      # Scenarios a shard did not record stay out of the map, so selection always runs them.
      - name: Merge coverage maps
        run: bun e2e/parity/coverage-map.ts merge e2e/artifacts/parity-coverage-map.json shard-maps/*/*/coverage-map.json

      # For local PARITY_CHANGED runs; e2e/parity/README.md shows the download command.
      - name: Upload coverage map
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity-coverage-map
          path: e2e/artifacts/parity-coverage-map.json
          if-no-files-found: error
