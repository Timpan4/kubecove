name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - docs/wiki/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sync canonical Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Timpan4/kubecove.wiki.git" wiki
          rsync -a --delete --exclude=.git docs/wiki/ wiki/
          diff -qr --exclude=.git docs/wiki wiki
          if test -z "$(git -C wiki status --porcelain)"; then
            exit 0
          fi
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add --all
          git -C wiki commit -m "docs: sync wiki"
          git -C wiki push
