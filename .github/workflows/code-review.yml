name: code-review

# OpenCodeReview on the wall-e review runners. The shared workflow lives in the
# public Timpan4/ocr-review repository. Fork pull requests skip the review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: Timpan4/ocr-review/.github/workflows/review.yml@v1
