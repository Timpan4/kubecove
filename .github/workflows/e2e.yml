name: E2E

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-primary:
    name: Real Kubernetes 1.35 probation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            dbus
            dbus-x11
            gnome-keyring
            libayatana-appindicator3-dev
            libsecret-1-0
            libwebkit2gtk-4.1-dev
            librsvg2-dev
            libssl-dev
            patchelf
            xvfb
          version: e2e-tauri-linux-v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kubecove-e2e
          workspaces: |
            ./src-tauri -> target
            ./src-tauri/server -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real suite
        run: |
          dbus-run-session -- bash -euc '
            set -o pipefail
            if ! keyring_env="$(gnome-keyring-daemon --start --components=secrets)"; then
              echo "Failed to start gnome-keyring-daemon"
              exit 1
            fi
            eval "$keyring_env"
            dbus-send --session --print-reply \
              --dest=org.freedesktop.secrets \
              /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.SetAlias \
              string:default \
              objpath:/org/freedesktop/secrets/collection/session
            exec xvfb-run -a bun run e2e:real -- --kubernetes 1.35 --provider docker
          '

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-real-1.35-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  real-matrix:
    name: Real Kubernetes ${{ matrix.kubernetes }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34", "1.35", "1.36", "1.37"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            dbus
            dbus-x11
            gnome-keyring
            libayatana-appindicator3-dev
            libsecret-1-0
            libwebkit2gtk-4.1-dev
            librsvg2-dev
            libssl-dev
            patchelf
            xvfb
          version: e2e-tauri-linux-v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kubecove-e2e
          workspaces: |
            ./src-tauri -> target
            ./src-tauri/server -> target
          # The primary Kubernetes version seeds the cache for all Linux runs.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.kubernetes == '1.35' }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real suite
        run: |
          dbus-run-session -- bash -euc '
            set -o pipefail
            if ! keyring_env="$(gnome-keyring-daemon --start --components=secrets)"; then
              echo "Failed to start gnome-keyring-daemon"
              exit 1
            fi
            eval "$keyring_env"
            dbus-send --session --print-reply \
              --dest=org.freedesktop.secrets \
              /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.SetAlias \
              string:default \
              objpath:/org/freedesktop/secrets/collection/session
            exec xvfb-run -a bun run e2e:real -- --kubernetes "${{ matrix.kubernetes }}" --provider docker
          '

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-real-${{ matrix.kubernetes }}-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kubecove-e2e
          workspaces: |
            ./src-tauri -> target
            ./src-tauri/server -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run native desktop smoke
        run: bun run e2e:desktop-smoke
