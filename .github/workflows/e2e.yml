name: E2E

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      compatibility-only:
        description: Run the Kubernetes compatibility matrix for a tagged release.
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.compatibility-only && 'release-compatibility' || github.event_name == 'push' && 'primary' || 'matrix' }}
  cancel-in-progress: true

jobs:
  real-primary:
    name: Real Kubernetes 1.35 probation
    if: ${{ !inputs.compatibility-only && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # As in ci.yml: no step reads full debug information, and line tables shrink the
      # compiler output this job links, caches and restores.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Linux Kind jobs share the server build cache. Only the main push job saves it.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs e2e .github/workflows/e2e.yml e2e/lifecycle.ts rust ':!rust/gpui'

      - name: Setup Mr Boxington
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: rust
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real suite
        run: bun run e2e:real -- --kubernetes 1.35 --provider docker

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-real-1.35-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  real-matrix:
    name: Real Kubernetes ${{ matrix.kubernetes }}
    if: ${{ inputs.compatibility-only || github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The compiler flags must match the job that saves the cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34", "1.35", "1.36", "1.37"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Linux Kind jobs share the server build cache. Only the main push job saves it.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs e2e .github/workflows/e2e.yml e2e/lifecycle.ts rust ':!rust/gpui'

      - name: Setup Mr Boxington
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: rust
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real suite
        run: bun run e2e:real -- --kubernetes "${{ matrix.kubernetes }}" --provider docker

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-real-${{ matrix.kubernetes }}-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    if: ${{ !inputs.compatibility-only && github.event_name != 'push' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # No Rust build cache: these jobs run nightly or by hand, and the Linux caches that pull
      # requests restore take about 7.5 GB of the repository's 10 GB cache quota (cache list
      # of 2026-11-13). GitHub evicts the least recently used caches above the quota.
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run GPUI desktop smoke
        run: bun run e2e:desktop-smoke

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-desktop-smoke-${{ matrix.os }}-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore
