name: E2E

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  real-primary:
    name: Real Kubernetes 1.35 probation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # As in ci.yml: no step reads full debug information, and line tables shrink the
      # compiler output this job links, caches and restores.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache action never updates the package lists on a hosted runner. A list older than
      # the archive asks for package versions the mirror has dropped, the install fails with 404,
      # and the action then saves an empty cache.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            dbus
            dbus-x11
            gnome-keyring
            libayatana-appindicator3-dev
            libsecret-1-0
            libwebkit2gtk-4.1-dev
            librsvg2-dev
            libssl-dev
            patchelf
            xvfb
          version: e2e-tauri-linux-v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # One cache holds the desktop and the headless server build: the objects payload carries
      # what every Cargo step compiled, whichever target directory it built in. The target
      # payload this replaces saved nothing, because Cargo 1.100 keeps unit state under build/
      # (ci.yml has the details). Every Linux E2E job here and in release.yml uses this key,
      # and only the job that runs on pushes to main saves it.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs e2e .github/workflows/e2e.yml e2e/lifecycle.ts src-tauri ':!src-tauri/gpui'

      - name: Setup Mr Boxington
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: src-tauri
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real suite
        run: |
          dbus-run-session -- bash -euc '
            set -o pipefail
            if ! keyring_env="$(gnome-keyring-daemon --start --components=secrets)"; then
              echo "Failed to start gnome-keyring-daemon"
              exit 1
            fi
            eval "$keyring_env"
            dbus-send --session --print-reply \
              --dest=org.freedesktop.secrets \
              /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.SetAlias \
              string:default \
              objpath:/org/freedesktop/secrets/collection/session
            exec xvfb-run -a bun run e2e:real -- --kubernetes 1.35 --provider docker
          '

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-real-1.35-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  real-matrix:
    name: Real Kubernetes ${{ matrix.kubernetes }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The compiler flags must match the job that saves the cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34", "1.35", "1.36", "1.37"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache action never updates the package lists on a hosted runner. A list older than
      # the archive asks for package versions the mirror has dropped, the install fails with 404,
      # and the action then saves an empty cache.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            dbus
            dbus-x11
            gnome-keyring
            libayatana-appindicator3-dev
            libsecret-1-0
            libwebkit2gtk-4.1-dev
            librsvg2-dev
            libssl-dev
            patchelf
            xvfb
          version: e2e-tauri-linux-v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # One cache holds the desktop and the headless server build: the objects payload carries
      # what every Cargo step compiled, whichever target directory it built in. The target
      # payload this replaces saved nothing, because Cargo 1.100 keeps unit state under build/
      # (ci.yml has the details). Every Linux E2E job here and in release.yml uses this key,
      # and only the job that runs on pushes to main saves it.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs e2e .github/workflows/e2e.yml e2e/lifecycle.ts src-tauri ':!src-tauri/gpui'

      - name: Setup Mr Boxington
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: src-tauri
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real suite
        run: |
          dbus-run-session -- bash -euc '
            set -o pipefail
            if ! keyring_env="$(gnome-keyring-daemon --start --components=secrets)"; then
              echo "Failed to start gnome-keyring-daemon"
              exit 1
            fi
            eval "$keyring_env"
            dbus-send --session --print-reply \
              --dest=org.freedesktop.secrets \
              /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.SetAlias \
              string:default \
              objpath:/org/freedesktop/secrets/collection/session
            exec xvfb-run -a bun run e2e:real -- --kubernetes "${{ matrix.kubernetes }}" --provider docker
          '

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-real-${{ matrix.kubernetes }}-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # No Rust build cache: these jobs run nightly or by hand, and the Linux caches that pull
      # requests restore take about 7.5 GB of the repository's 10 GB cache quota (cache list
      # of 2026-11-13). GitHub evicts the least recently used caches above the quota.
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run native desktop smoke
        run: bun run e2e:desktop-smoke

      # The suite writes its WDIO log to a file under e2e/artifacts, so without this upload a
      # failed run shows only "node failed (1)".
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-desktop-smoke-${{ matrix.os }}-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore
