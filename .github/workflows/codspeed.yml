name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect benchmark changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      rust: ${{ steps.detect.outputs.rust }}
      frontend_matrix: ${{ steps.detect.outputs.frontend_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # A failed setup leaves the install step failing, which selects everything below.
      - name: Setup Bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install selector dependencies
        id: dependencies
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Test benchmark orchestration
        id: selection-check
        continue-on-error: true
        run: node --test scripts/codspeed-workflow-regression.test.mjs scripts/codspeed-selection.test.mjs

      - name: Detect frontend and Rust benchmark changes
        id: detect
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          SELECTION_CHECK_RESULT: ${{ steps.selection-check.outcome }}
        run: |
          set -euo pipefail
          fallback() {
            echo 'frontend=true' >> "${GITHUB_OUTPUT}"
            echo 'rust=true' >> "${GITHUB_OUTPUT}"
            echo 'frontend_matrix={"include":[{"group":0,"selection":""}]}' >> "${GITHUB_OUTPUT}"
            {
              echo '## Benchmark selection'
              echo 'Selection could not be computed. Running every frontend file without name filters and all Rust shards (ac, dl, es, hr, jn, other). Skipped: none.'
              git ls-files 'benchmarks/*.bench.ts' || echo 'Benchmark file listing unavailable; the benchmark runner will discover all files.'
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          if [[ "${DEPENDENCIES_RESULT}" != "success" || "${SELECTION_CHECK_RESULT}" != "success" ]]; then
            fallback
            exit 0
          fi
          changed="${RUNNER_TEMP}/codspeed-changed-files"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
              export SELECTION_FALLBACK="no usable base commit"
            else
              for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
                if ! git cat-file -e "${sha}^{commit}"; then
                  if ! git fetch --no-tags --depth=1 origin "${sha}"; then fallback; exit 0; fi
                fi
              done
              if ! git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed}"; then fallback; exit 0; fi
            fi
          fi
          # The selector writes to a file of its own, and its outputs count only when all
          # three are present and the matrix agrees with the frontend flag.
          selection="${RUNNER_TEMP}/codspeed-selection"
          : > "${selection}"
          valid() {
            node scripts/codspeed-validate-selection.mjs "${selection}"
          }
          if GITHUB_OUTPUT="${selection}" node scripts/codspeed-detect.mjs "${changed}" && valid; then
            cat "${selection}" >> "${GITHUB_OUTPUT}"
          else
            fallback
          fi

  frontend:
    name: Run frontend benchmarks (${{ matrix.group }})
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Eight groups balanced by run 43322953935 file and benchmark durations.
      # Name filters split long files while preserving CodSpeed identities.
      matrix: ${{ fromJSON(needs.changes.outputs.frontend_matrix) }}
    env:
      KUBECOVE_BENCHMARK_SELECTION: ${{ matrix.selection }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmarks
        uses: ./.github/actions/codspeed-run
        with:
          run: bunx vitest bench --run

  rust-build:
    name: Build Rust benchmarks
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # Use the Rust cold-cache allowance from ci.yml.
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
      toolchain: ${{ steps.build.outputs.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-codspeed-registry
          workspaces: "./rust -> target"
          prefix-key: dependency-rust
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # An unchanged build restores its exact cache and skips the save
      # (scripts/ci-rust-cache-key.mjs).
      # The name differs from the earlier desktop build's `codspeed` cache, so a run never
      # restores that 2.2 GB cache for objects this build cannot use.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs codspeed-backend .github/workflows/codspeed.yml scripts/codspeed-rust-artifact.mjs rust ':!rust/gpui' ':!rust/server'

      # The build job is the only writer. PRs restore main's content-keyed objects.
      - name: Setup Mr Boxington for CodSpeed builds
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: rust
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      # Puts the mbx Cargo shim first on PATH, so the build cargo-codspeed starts is cached.
      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install cargo-codspeed
        env:
          CARGO_CODSPEED_SHA256: df4b2618fda2aa19f8b92e8d745548a49d9ce20785472eeb584fdc2c99624395
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cargo-codspeed"
          curl --fail --location --silent --show-error \
            --output "$binary" \
            https://github.com/CodSpeedHQ/codspeed-rust/releases/download/v5.0.1/cargo-codspeed-x86_64-unknown-linux-musl
          echo "$CARGO_CODSPEED_SHA256  $binary" | sha256sum --check --status
          install -m 0755 "$binary" "$HOME/.cargo/bin/cargo-codspeed"

      - name: Build and seal the benchmark
        id: build
        run: node scripts/codspeed-rust-artifact.mjs build "$RUNNER_TEMP/codspeed-backend"

      - name: Upload the benchmark artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codspeed-backend-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codspeed-backend/
          if-no-files-found: error

  rust:
    name: Run Rust benchmarks (${{ matrix.shard }})
    permissions:
      contents: read
      id-token: write
    needs: [changes, rust-build]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # Keep the job IDs and both matrices: CodSpeed includes GITHUB_JOB, GH_MATRIX
    # and GH_STRATEGY in each shard's upload identity.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: dl
            filter: "(?:^|::)[dl][^:]*$"
          - shard: es
            filter: "(?:^|::)[es][^:]*$"
          - shard: hr
            filter: "(?:^|::)[hr][^:]*$"
          - shard: jn
            filter: "(?:^|::)[jn][^:]*$"
          - shard: other
            filter: "(?:^|::)[^acdehjlnrs:][^:]*$"

    steps: &rust-steps
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require the build artifact identity
        env:
          ARTIFACT_ID: ${{ needs.rust-build.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'

      # Download the successful dependency's ID even when only failed shards are rerun.
      - name: Download the benchmark artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rust-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/codspeed-backend/
          digest-mismatch: error

      - name: Verify and install the benchmark
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.rust-build.outputs.manifest-sha256 }}
          EXPECTED_TOOLCHAIN: ${{ needs.rust-build.outputs.toolchain }}
        run: node scripts/codspeed-rust-artifact.mjs install "$RUNNER_TEMP/codspeed-backend"

      - name: Run benchmarks
        uses: ./.github/actions/codspeed-run
        with:
          # Equivalent to cargo-codspeed 5.0.1's simulation launch after cargo metadata.
          run: cd rust && CODSPEED_CARGO_WORKSPACE_ROOT="$PWD" exec ./target/codspeed/analysis/kubecove/backend_hot_paths '${{ matrix.filter }}'

  rust-saver:
    name: Run Rust benchmarks (${{ matrix.shard }})
    permissions:
      contents: read
      id-token: write
    needs: [changes, rust-build]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ac
            filter: "(?:^|::)[ac][^:]*$"

    steps: *rust-steps

  check:
    name: CodSpeed Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - frontend
      - rust-build
      - rust
      - rust-saver
    if: always()

    steps:
      - name: Verify benchmark result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_BUILD_RESULT: ${{ needs.rust-build.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_SAVER_RESULT: ${{ needs.rust-saver.result }}
        run: |
          set -euo pipefail
          echo "Change detection: ${CHANGES_RESULT}"
          echo "Frontend benchmarks: ${FRONTEND_RESULT} (required: ${FRONTEND_REQUIRED})"
          echo "Rust build: ${RUST_BUILD_RESULT}"
          echo "Rust benchmarks: ${RUST_RESULT} and ${RUST_SAVER_RESULT} (required: ${RUST_REQUIRED})"
          {
            echo '## Benchmark job results'
            echo "Frontend: ${FRONTEND_RESULT} (selected: ${FRONTEND_REQUIRED})."
            echo "Rust build: ${RUST_BUILD_RESULT}; benchmark shards: ${RUST_RESULT} and ${RUST_SAVER_RESULT} (selected: ${RUST_REQUIRED})."
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${CHANGES_RESULT}" = "success"
          verify_result() {
            local required="$1"
            local result="$2"
            if [[ "${required}" == "true" ]]; then
              test "${result}" = "success"
            else
              test "${required}" = "false"
              test "${result}" = "skipped"
            fi
          }
          verify_result "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
          verify_result "${RUST_REQUIRED}" "${RUST_BUILD_RESULT}"
          verify_result "${RUST_REQUIRED}" "${RUST_RESULT}"
          verify_result "${RUST_REQUIRED}" "${RUST_SAVER_RESULT}"
