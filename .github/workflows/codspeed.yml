name: CodSpeed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare Cargo updates on one runner
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BENCH_FILTER: serialize_large_resource_kyaml|sort_custom_resource_catalog_1000_kinds|argo_selected_comparison_json_encoding|dynamic_resource_identity_health_edges|namespace_name_age_projection_100|port_forward_session_summary_json_encoding|typed_resource_summaries_10000|usage_process_attribution_macos_orphans|argo_project_list_json_encoding|argo_application_list_json_encoding
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: 1f4daaf5de5b2d3f97c0a5ffe7eee828beb11d8d
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout updated dependencies
        uses: actions/checkout@v7
        with:
          ref: 5517ce1264053d32825a5be6ed3187188504dfcc
          path: updated
          persist-credentials: false

      - name: Verify comparison scope
        run: |
          set -euo pipefail
          git -C baseline diff HEAD "$(git -C updated rev-parse HEAD)" --stat
          test -z "$(git -C baseline diff --name-only HEAD "$(git -C updated rev-parse HEAD)" -- '*.rs' '.github/workflows/*')"
          lscpu

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Record compiler
        run: rustc --version

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-rust-cargo-comparison
          workspaces: baseline/src-tauri -> ../../target

      - name: Build both benchmark binaries
        run: |
          set -euo pipefail
          for revision in baseline updated; do
            binary=$(cargo bench --manifest-path "${revision}/src-tauri/Cargo.toml" \
              --features bench-support --bench backend_hot_paths --locked --no-run \
              --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "backend_hot_paths" and .executable != null) | .executable')
            test -n "${binary}"
            install -m 755 "${binary}" "${RUNNER_TEMP}/${revision}-bench"
          done

      - name: Measure both orders
        run: |
          set -euo pipefail
          for revision in baseline updated updated baseline; do
            echo "::group::${revision} native walltime"
            "${RUNNER_TEMP}/${revision}-bench" --bench --color never "${BENCH_FILTER}" \
              | tee "${RUNNER_TEMP}/${revision}-timings.txt"
            grep -qi 'fastest.*slowest.*median' "${RUNNER_TEMP}/${revision}-timings.txt"
            echo "::endgroup::"
          done
