name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect benchmark changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      rust: ${{ steps.detect.outputs.rust }}
      frontend_matrix: ${{ steps.detect.outputs.frontend_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # A failed setup leaves the install step failing, which selects everything below.
      - name: Setup Bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install selector dependencies
        id: dependencies
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Test benchmark orchestration
        id: selection-check
        continue-on-error: true
        run: node --test scripts/codspeed-workflow-regression.test.mjs scripts/codspeed-selection.test.mjs

      - name: Detect frontend and Rust benchmark changes
        id: detect
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          SELECTION_CHECK_RESULT: ${{ steps.selection-check.outcome }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          fallback() {
            echo 'frontend=true' >> "${GITHUB_OUTPUT}"
            echo 'rust=true' >> "${GITHUB_OUTPUT}"
            echo 'frontend_matrix={"include":[{"group":0,"selection":""}]}' >> "${GITHUB_OUTPUT}"
            {
              echo '## Benchmark selection'
              echo 'Selection could not be computed. Running every frontend file without name filters and all Rust shards (ac, dl, es, hr, jn, other). Skipped: none.'
              git ls-files 'benchmarks/*.bench.ts' || echo 'Benchmark file listing unavailable; the benchmark runner will discover all files.'
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          if [[ "${RELEASE_PR}" == true ]]; then
            {
              echo 'frontend=false'
              echo 'rust=false'
              echo 'frontend_matrix={"include":[]}'
            } >> "${GITHUB_OUTPUT}"
            {
              echo '## Benchmark selection'
              echo 'Labeled same-repository release PR. Frontend benchmarks and Rust shards skipped.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${DEPENDENCIES_RESULT}" != "success" || "${SELECTION_CHECK_RESULT}" != "success" ]]; then
            fallback
            exit 0
          fi
          changed="${RUNNER_TEMP}/codspeed-changed-files"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
              export SELECTION_FALLBACK="no usable base commit"
            else
              for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
                if ! git cat-file -e "${sha}^{commit}"; then
                  if ! git fetch --no-tags --depth=1 origin "${sha}"; then fallback; exit 0; fi
                fi
              done
              if ! git diff --name-only --no-renames -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed}"; then fallback; exit 0; fi
            fi
          fi
          # The selector writes to a file of its own, and its outputs count only when all
          # three are present and the matrix agrees with the frontend flag.
          selection="${RUNNER_TEMP}/codspeed-selection"
          : > "${selection}"
          valid() {
            node scripts/codspeed-validate-selection.mjs "${selection}"
          }
          if GITHUB_OUTPUT="${selection}" node scripts/codspeed-detect.mjs "${changed}" && valid; then
            cat "${selection}" >> "${GITHUB_OUTPUT}"
          else
            fallback
          fi

  frontend:
    name: Run frontend benchmarks (${{ matrix.group }})
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Eight groups balanced by run 43322953935 file and benchmark durations.
      # Name filters split long files while preserving CodSpeed identities.
      matrix: ${{ fromJSON(needs.changes.outputs.frontend_matrix) }}
    env:
      KUBECOVE_BENCHMARK_SELECTION: ${{ matrix.selection }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmarks
        uses: ./.github/actions/codspeed-run
        with:
          run: bunx vitest bench --run

  rust:
    name: Run Rust benchmarks (${{ matrix.shard }})
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    # Every shard builds the same benchmark binary under one cache key, and the cache action
    # fails a job whose save loses GitHub's reservation of the key to another job (four of
    # six shards in run 43397675100). These shards get read-only cache access and the
    # `rust-saver` job below saves. `cache-mode` takes one literal value per job, which is
    # why the saving shard is a job of its own. Setting ACTIONS_CACHE_MODE on the step does
    # nothing: the runner sets that variable for actions from the job's cache-mode (run
    # 43407667697). Each job's "Set up job" log prints the access it got as "Cache mode".
    cache-mode: read
    # Simulation mode costs about 7.5 s per benchmark whatever it measures (run 43316700493),
    # so one job ran 117 benchmarks for 13 to 16 minutes. Each shard runs the benchmarks whose
    # last divan path segment starts with one of its letters; CodSpeed merges the uploads of
    # one workflow run into one report. Divan tests each benchmark (or generic argument)
    # against one path, and the last class is the complement of the others, so the shards are
    # disjoint and complete (scripts/codspeed-workflow-regression.test.mjs). The letters are
    # paired so each shard ran 144 to 159 s of benchmarks in that run. The sixth shard, `ac`,
    # is the `rust-saver` job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: dl
            filter: "(?:^|::)[dl][^:]*$"
          - shard: es
            filter: "(?:^|::)[es][^:]*$"
          - shard: hr
            filter: "(?:^|::)[hr][^:]*$"
          - shard: jn
            filter: "(?:^|::)[jn][^:]*$"
          - shard: other
            filter: "(?:^|::)[^acdehjlnrs:][^:]*$"

    steps: &rust-steps
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-codspeed-registry
          workspaces: "./src-tauri -> target"
          prefix-key: dependency-rust
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'ac' }}

      # An unchanged build restores its exact cache and skips the save
      # (scripts/ci-rust-cache-key.mjs).
      # The name differs from the earlier desktop build's `codspeed` cache, so a run never
      # restores that 2.2 GB cache for objects this build cannot use.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs codspeed-backend .github/workflows/codspeed.yml src-tauri ':!src-tauri/gpui' ':!src-tauri/server'

      # Every shard builds the same benchmark binary. A cached target directory does not
      # survive a fresh checkout, because Cargo compares file times, so the object cache
      # reuses compiler output by content, with the settings ci.yml uses. Main saves it and
      # pull requests only restore it, as in ci.yml.
      - name: Setup Mr Boxington for CodSpeed builds
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: src-tauri
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      # Puts the mbx Cargo shim first on PATH, so the build cargo-codspeed starts is cached.
      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install cargo-codspeed
        env:
          CARGO_CODSPEED_SHA256: df4b2618fda2aa19f8b92e8d745548a49d9ce20785472eeb584fdc2c99624395
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cargo-codspeed"
          curl --fail --location --silent --show-error \
            --output "$binary" \
            https://github.com/CodSpeedHQ/codspeed-rust/releases/download/v5.0.1/cargo-codspeed-x86_64-unknown-linux-musl
          echo "$CARGO_CODSPEED_SHA256  $binary" | sha256sum --check --status
          install -m 0755 "$binary" "$HOME/.cargo/bin/cargo-codspeed"

      # The benchmarks measure backend code, so they build without the `desktop` feature.
      # With it, every shard compiled and linked the Tauri and WebKitGTK stack into the
      # root library, which the object cache cannot store: 277 to 383 s per shard in run
      # 43389328493, after installing the WebKitGTK packages.
      - name: Build Rust benchmarks
        working-directory: src-tauri
        run: cargo codspeed build --no-default-features --features bench-support --bench backend_hot_paths --locked

      - name: Run benchmarks
        uses: ./.github/actions/codspeed-run
        with:
          # cargo-codspeed passes the filter to the divan binary as its regex filter argument.
          run: cd src-tauri && cargo codspeed run --bench backend_hot_paths '${{ matrix.filter }}'

  # The shard that saves the Rust build cache on main. It runs the same steps as `rust` with
  # GitHub's default cache access.
  rust-saver:
    name: Run Rust benchmarks (${{ matrix.shard }})
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ac
            filter: "(?:^|::)[ac][^:]*$"

    steps: *rust-steps

  check:
    name: CodSpeed Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - frontend
      - rust
      - rust-saver
    if: always()

    steps:
      - name: Verify benchmark result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_SAVER_RESULT: ${{ needs.rust-saver.result }}
        run: |
          set -euo pipefail
          echo "Change detection: ${CHANGES_RESULT}"
          echo "Frontend benchmarks: ${FRONTEND_RESULT} (required: ${FRONTEND_REQUIRED})"
          echo "Rust benchmarks: ${RUST_RESULT} and ${RUST_SAVER_RESULT} (required: ${RUST_REQUIRED})"
          {
            echo '## Benchmark job results'
            echo "Frontend: ${FRONTEND_RESULT} (selected: ${FRONTEND_REQUIRED})."
            echo "Rust: ${RUST_RESULT}; cache-saving shard: ${RUST_SAVER_RESULT} (selected: ${RUST_REQUIRED})."
            echo "Release PR skip policy: ${RELEASE_PR}."
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${CHANGES_RESULT}" = "success"
          if [[ "${RELEASE_PR}" == "true" ]]; then
            test "${FRONTEND_RESULT}" = "skipped"
            test "${RUST_RESULT}" = "skipped"
            test "${RUST_SAVER_RESULT}" = "skipped"
          else
            verify_result() {
              local required="$1"
              local result="$2"
              if [[ "${required}" == "true" ]]; then
                test "${result}" = "success"
              else
                test "${required}" = "false"
                test "${result}" = "skipped"
              fi
            }
            verify_result "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
            verify_result "${RUST_REQUIRED}" "${RUST_RESULT}"
            verify_result "${RUST_REQUIRED}" "${RUST_SAVER_RESULT}"
          fi
