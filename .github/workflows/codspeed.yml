name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Run benchmarks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-rust-codspeed
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build Rust benchmarks
        working-directory: src-tauri
        run: cargo codspeed build --features bench-support --bench backend_hot_paths --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.0.3
        with:
          mode: simulation
          run: bunx vitest bench --run && cd src-tauri && cargo codspeed run --bench backend_hot_paths

  check:
    name: CodSpeed Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - benchmarks
    if: always()

    steps:
      - name: Verify benchmark result
        env:
          BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          echo "Benchmark result: ${BENCHMARK_RESULT}"
          if [[ "${RELEASE_PR}" == "true" ]]; then
            test "${BENCHMARK_RESULT}" = "skipped"
          else
            test "${BENCHMARK_RESULT}" = "success"
          fi
