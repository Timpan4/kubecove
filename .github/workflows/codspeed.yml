name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect benchmark changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      rust: ${{ steps.detect.outputs.rust }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test benchmark orchestration
        run: node --test scripts/codspeed-workflow-regression.test.mjs

      - name: Detect frontend and Rust benchmark changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            echo "rust=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No usable base commit; running benchmarks."
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            echo "rust=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
            if ! git cat-file -e "${sha}^{commit}"; then
              git fetch --no-tags --depth=1 origin "${sha}"
            fi
          done
          changed_files=$(git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}")
          frontend=false
          rust=false
          while IFS= read -r path; do
            if [[ "${path}" == .github/* || "${path}" == fixtures/* || "${path}" == */fixtures/* ]]; then
              frontend=true
              rust=true
            elif [[ "${path}" == src-tauri/gpui/* || "${path}" == src-tauri/server/* ]]; then
              # Separate Cargo workspaces (src-tauri/Cargo.toml excludes both); the benchmarks cannot depend on them.
              continue
            elif [[ "${path}" == e2e/* || "${path}" == tests/* ]]; then
              # The benchmarks import only src/, benchmarks/ and packages, so these trees cannot change a result.
              continue
            elif [[ "${path}" == src-tauri/* ]]; then
              rust=true
            else
              if [[ "${path}" =~ \.(svelte|js|jsx|mjs|cjs|ts|tsx|mts|cts|json)$ || "${path}" =~ (^|/)bun\.lock$ || "${path}" == src/* || "${path}" == benchmarks/* ]]; then
                frontend=true
              fi
              if [[ "${path}" =~ \.rs$ || "${path}" =~ (^|/)(Cargo\.(lock|toml)|rust-toolchain(\.toml)?)$ || "${path}" =~ (^|/)\.cargo/ ]]; then
                rust=true
              fi
            fi
          done <<< "${changed_files}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Run frontend benchmarks (${{ matrix.group }})
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Four groups balanced by measured duration. Weights come from run
      # 43308253138 "Run benchmarks" step durations, maintained in the selector.
      matrix:
        group: [0, 1, 2, 3]
    env:
      KUBECOVE_BENCHMARK_GROUP: ${{ matrix.group }}/4

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmarks
        uses: ./.github/actions/codspeed-run
        with:
          run: bunx vitest bench --run

  rust:
    name: Run Rust benchmarks (${{ matrix.shard }})
    permissions:
      contents: read
      id-token: write
    needs:
      - changes
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    # Simulation mode costs about 7.5 s per benchmark whatever it measures (run 43316700493),
    # so one job ran 117 benchmarks for 13 to 16 minutes. Each shard runs the benchmarks whose
    # last divan path segment starts with one of its letters; CodSpeed merges the uploads of
    # one workflow run into one report. Divan tests each benchmark (or generic argument)
    # against one path, and the last class is the complement of the others, so the shards are
    # disjoint and complete (scripts/codspeed-workflow-regression.test.mjs). The letters are
    # paired so each shard ran 144 to 159 s of benchmarks in that run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ac
            filter: "(?:^|::)[ac][^:]*$"
          - shard: dl
            filter: "(?:^|::)[dl][^:]*$"
          - shard: es
            filter: "(?:^|::)[es][^:]*$"
          - shard: hr
            filter: "(?:^|::)[hr][^:]*$"
          - shard: jn
            filter: "(?:^|::)[jn][^:]*$"
          - shard: other
            filter: "(?:^|::)[^acdehjlnrs:][^:]*$"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-codspeed-registry
          workspaces: "./src-tauri -> target"
          prefix-key: dependency-rust
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 'ac' }}

      # An unchanged build restores its exact cache and skips the save
      # (scripts/ci-rust-cache-key.mjs).
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs codspeed .github/workflows/codspeed.yml src-tauri ':!src-tauri/gpui' ':!src-tauri/server'

      # Every shard builds the same benchmark binary. A cached target directory does not
      # survive a fresh checkout, because Cargo compares file times, so the object cache
      # reuses compiler output by content, with the settings ci.yml uses. One shard saves it.
      - name: Setup Mr Boxington for CodSpeed builds
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: src-tauri
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          save-on-pull-request: ${{ matrix.shard == 'ac' }}

      # Puts the mbx Cargo shim first on PATH, so the build cargo-codspeed starts is cached.
      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install cargo-codspeed
        env:
          CARGO_CODSPEED_SHA256: df4b2618fda2aa19f8b92e8d745548a49d9ce20785472eeb584fdc2c99624395
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cargo-codspeed"
          curl --fail --location --silent --show-error \
            --output "$binary" \
            https://github.com/CodSpeedHQ/codspeed-rust/releases/download/v5.0.1/cargo-codspeed-x86_64-unknown-linux-musl
          echo "$CARGO_CODSPEED_SHA256  $binary" | sha256sum --check --status
          install -m 0755 "$binary" "$HOME/.cargo/bin/cargo-codspeed"

      - name: Build Rust benchmarks
        working-directory: src-tauri
        run: cargo codspeed build --features bench-support --bench backend_hot_paths --locked

      - name: Run benchmarks
        uses: ./.github/actions/codspeed-run
        with:
          # cargo-codspeed passes the filter to the divan binary as its regex filter argument.
          run: cd src-tauri && cargo codspeed run --bench backend_hot_paths '${{ matrix.filter }}'

  check:
    name: CodSpeed Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - frontend
      - rust
    if: always()

    steps:
      - name: Verify benchmark result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          echo "Change detection: ${CHANGES_RESULT}"
          echo "Frontend benchmarks: ${FRONTEND_RESULT} (required: ${FRONTEND_REQUIRED})"
          echo "Rust benchmarks: ${RUST_RESULT} (required: ${RUST_REQUIRED})"
          test "${CHANGES_RESULT}" = "success"
          if [[ "${RELEASE_PR}" == "true" ]]; then
            test "${FRONTEND_RESULT}" = "skipped"
            test "${RUST_RESULT}" = "skipped"
          else
            verify_result() {
              local required="$1"
              local result="$2"
              if [[ "${required}" == "true" ]]; then
                test "${result}" = "success"
              else
                test "${required}" = "false"
                test "${result}" = "skipped"
              fi
            }
            verify_result "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
            verify_result "${RUST_REQUIRED}" "${RUST_RESULT}"
          fi
