name: CodSpeed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare Cargo updates with matched CPU simulation
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BENCH_FILTER: serialize_large_resource_kyaml|sort_custom_resource_catalog_1000_kinds|argo_selected_comparison_json_encoding|dynamic_resource_identity_health_edges|namespace_name_age_projection_100|port_forward_session_summary_json_encoding|typed_resource_summaries_10000|usage_process_attribution_macos_orphans|argo_project_list_json_encoding|argo_application_list_json_encoding
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: 56606edb7154f7ac47541c2d7cf761e9ff213a7b
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout updated dependencies
        uses: actions/checkout@v7
        with:
          ref: a2fad45d56ae086c7404f712285afd94f113a26f
          path: updated
          persist-credentials: false

      - name: Verify comparison scope
        run: |
          set -euo pipefail
          git -C baseline diff HEAD "$(git -C updated rev-parse HEAD)" --stat
          test -z "$(git -C baseline diff --name-only HEAD "$(git -C updated rev-parse HEAD)" -- '*.rs' '.github/workflows/*')"
          lscpu

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Record compiler
        run: rustc --version

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-rust-cargo-simulation-comparison
          workspaces: baseline/src-tauri -> ../../target

      - name: Build both benchmark binaries
        run: |
          set -euo pipefail
          for revision in baseline updated; do
            (cd "${revision}/src-tauri" && cargo codspeed build -m simulation \
              --features bench-support --bench backend_hot_paths --locked)
            binary="${CARGO_TARGET_DIR}/codspeed/analysis/kubecove/backend_hot_paths"
            install -m 755 "${binary}" "${RUNNER_TEMP}/${revision}-bench"
          done

      - name: Prepare matching CodSpeed simulation instrument
        uses: CodSpeedHQ/action@v5.4.0
        env:
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          mode: simulation
          allow-empty: "true"
          run: "true"

      - name: Measure both orders and retain baseline control
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cargo-simulation"
          rustc --version > "${RUNNER_TEMP}/cargo-simulation/compiler.txt"
          codspeed --version > "${RUNNER_TEMP}/cargo-simulation/runner.txt"
          lscpu > "${RUNNER_TEMP}/cargo-simulation/cpu.txt"
          git -C baseline rev-parse HEAD > "${RUNNER_TEMP}/cargo-simulation/baseline-sha.txt"
          git -C updated rev-parse HEAD > "${RUNNER_TEMP}/cargo-simulation/updated-sha.txt"
          measurement=0
          for revision in baseline updated updated baseline; do
            measurement=$((measurement + 1))
            IFS='|' read -r -a benchmarks <<< "${BENCH_FILTER}"
            for benchmark in "${benchmarks[@]}"; do
              profile="${RUNNER_TEMP}/cargo-simulation/${measurement}-${revision}/${benchmark}"
              mkdir -p "${profile}"
              echo "::group::${measurement} ${revision} ${benchmark} CPU simulation"
              CODSPEED_CARGO_WORKSPACE_ROOT="${GITHUB_WORKSPACE}/${revision}/src-tauri" \
                codspeed run --mode simulation --skip-upload --show-full-output \
                --working-directory "${GITHUB_WORKSPACE}/${revision}/src-tauri" \
                --profile-folder "${profile}" \
                -- "\"${RUNNER_TEMP}/${revision}-bench\" \"::${benchmark}$\"" \
                2>&1 | tee "${profile}/run.log"
              grep -E '^(events|summary|totals):' "${profile}"/*.out* \
                | tee "${profile}/counters.txt"
              test "$(grep -h '^desc: Trigger: Client Request: benches/' "${profile}"/*.out* \
                | wc -l)" -eq 1
              echo "::endgroup::"
            done
          done

      - name: Retain raw simulation profiles
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cargo-simulation-comparison
          path: ${{ runner.temp }}/cargo-simulation
          if-no-files-found: error
