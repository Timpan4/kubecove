name: Release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      # `gh workflow run release.yml --ref <branch> -f gpui-dry-run=true` builds, signs and
      # verifies the GPUI bundles as workflow artifacts. Every other job carries
      # `!inputs.gpui-dry-run`, so the dry run never reads a release or treats the branch as a tag.
      gpui-dry-run:
        description: Only build, sign and verify the GPUI client bundles; touch no release.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-draft: ${{ steps.release.outputs.release-draft }}
      release-exists: ${{ steps.release.outputs.release-exists }}

    steps:
      - name: Detect existing release state
        id: release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if release_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>release-error.txt)"; then
            if [[ "$release_draft" != "true" ]]; then
              echo "::error::Release $TAG_NAME is already published; refusing to overwrite live release assets." >&2
              exit 1
            fi
            echo "release-draft=true" >> "$GITHUB_OUTPUT"
            echo "release-exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE "not found|404" release-error.txt; then
            echo "release-draft=true" >> "$GITHUB_OUTPUT"
            echo "release-exists=false" >> "$GITHUB_OUTPUT"
          else
            cat release-error.txt >&2
            exit 1
          fi

  metadata:
    name: Release metadata
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-body: ${{ steps.release_body.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Validate release tag and versions
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bun scripts/validate-release-tag.ts

      - name: Read release notes
        id: release_body
        shell: bash
        run: |
          {
            echo "body<<EOF"
            bun scripts/release-body.ts
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend release checks
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsparallel
      - parallel:
          - name: Check documentation
            run: bun run docs:check

          - name: Test release orchestration
            run: node --test scripts/release-workflow-regression.test.mjs

          - name: Typecheck frontend
            run: bun run typecheck

          - name: Lint frontend
            run: bun run lint

      # Svelte compilation tests need the runner after the parallel checks finish.
      - name: Test frontend
        run: bun test

  backend-rust:
    name: Backend Rust release checks
    needs: metadata
    if: ${{ !inputs.gpui-dry-run }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Test shared backend
        run: cargo test --locked --workspace --manifest-path src-tauri/Cargo.toml

      - name: Lint shared backend
        run: cargo clippy --locked --workspace --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  kubernetes-compatibility:
    name: Kubernetes compatibility release checks
    needs: metadata
    if: ${{ !inputs.gpui-dry-run }}
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    with:
      compatibility-only: true

  server-packaging:
    name: Server packaging
    needs: metadata
    if: ${{ !inputs.gpui-dry-run }}
    uses: ./.github/workflows/server-packaging.yml
    permissions:
      contents: read
    with:
      release-tag: ${{ github.ref_name }}

  # The only job a GPUI dry run starts. It gets read-only contents and uploads workflow
  # artifacts; stage-release-assets uploads them to the release. A dry run passes no tag, so the
  # manifest points at app-v<version> instead of the branch name.
  gpui:
    name: GPUI client bundles
    needs: metadata
    if: ${{ !cancelled() && (inputs.gpui-dry-run || needs.metadata.result == 'success') }}
    uses: ./.github/workflows/gpui-release.yml
    permissions:
      contents: read
    with:
      release-tag: ${{ !inputs.gpui-dry-run && github.ref_name || '' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  nix:
    name: Nix ${{ matrix.label }} release build
    if: ${{ !inputs.gpui-dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: ubuntu-latest
          - label: Linux arm64
            platform: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      # Enable with a Cachix cache, as in ci.yml.
      # - name: Use the Cachix cache
      #   uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      #   with:
      #     name: <cache name>
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build KubeCove
        run: nix build .#kubecove --print-build-logs

  verify:
    name: Verify release inputs
    needs:
      - metadata
      - frontend
      - backend-rust
      - kubernetes-compatibility
      - server-packaging
    if: ${{ always() && !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RUST_RESULT: ${{ needs.backend-rust.result }}
          KUBERNETES_COMPATIBILITY_RESULT: ${{ needs.kubernetes-compatibility.result }}
          SERVER_PACKAGING_RESULT: ${{ needs.server-packaging.result }}
        run: |
          set -euo pipefail
          echo "Release metadata: ${METADATA_RESULT}"
          echo "Frontend release checks: ${FRONTEND_RESULT}"
          echo "Backend Rust release checks: ${BACKEND_RUST_RESULT}"
          echo "Kubernetes compatibility: ${KUBERNETES_COMPATIBILITY_RESULT}"
          echo "Server and container packaging: ${SERVER_PACKAGING_RESULT}"
          test "${METADATA_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${BACKEND_RUST_RESULT}" = "success"
          test "${KUBERNETES_COMPATIBILITY_RESULT}" = "success"
          test "${SERVER_PACKAGING_RESULT}" = "success"

  draft:
    name: Create draft release
    needs:
      - prepare
      - metadata
      - verify
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create release before asset builds
        if: needs.prepare.outputs.release-draft == 'true' && needs.prepare.outputs.release-exists != 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.metadata.outputs.release-body }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#app-v}"
          printf '%s\n' "$RELEASE_BODY" > release-notes.md
          gh release create "$TAG_NAME" \
            --title "KubeCove v${version}" \
            --notes-file release-notes.md \
            --draft \
            --verify-tag

  stage-release-assets:
    name: Upload and verify release assets
    needs:
      - draft
      - gpui
      - metadata
    if: >-
      ${{ !cancelled() && !inputs.gpui-dry-run
          && needs.draft.result == 'success' && needs.gpui.result == 'success'
          && needs.metadata.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download release build artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --pattern 'kubecove-server-*' --pattern kubecove-gpui-release --dir run-assets

      - name: Verify release is still a draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
          if [[ "$release_draft" != "true" ]]; then
            echo "::error::Release $TAG_NAME is already published; refusing to overwrite live release assets." >&2
            exit 1
          fi

      - name: Upload headless server release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" run-assets/kubecove-server-*/kubecove-server_* --clobber

      # Signed and verified in gpui-release.yml: the GPUI bundles, their `.sig` files and latest-gpui.json.
      - name: Upload GPUI release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" run-assets/kubecove-gpui-release/* --clobber

      - name: Verify final updater platform coverage
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#app-v}"
          tmp="$(mktemp -d)"
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' > "$tmp/assets.txt"
          gh release download "$TAG_NAME" --pattern latest-gpui.json --clobber --dir "$tmp"
          UPDATER_CHECK_DIR="$tmp" RELEASE_VERSION="$version" node <<'EOF'
          const { readFileSync } = require("node:fs");

          const dir = process.env.UPDATER_CHECK_DIR;
          const version = process.env.RELEASE_VERSION;
          const assets = new Set(readFileSync(`${dir}/assets.txt`, "utf8")
            .split(/\r?\n/)
            .filter(Boolean));
          const gpui = JSON.parse(readFileSync(`${dir}/latest-gpui.json`, "utf8"));
          const gpuiPlatforms = gpui.platforms ?? {};

          const requiredAssets = [
            ...["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"].flatMap((target) =>
              ["", "-slim"].flatMap((suffix) => {
                const archive = `kubecove-server_${version}_${target}${suffix}.tar.gz`;
                return [archive, `${archive}.sha256`];
              })),
            ...[`kubecove-gpui_${version}_aarch64.app.tar.gz`, `kubecove-gpui_${version}_x86_64.AppImage`,
              `kubecove-gpui_${version}_x64-setup.exe`].flatMap((bundle) => [bundle, `${bundle}.sig`]),
            `kubecove-gpui_${version}_aarch64.dmg`,
            "latest-gpui.json",
          ];
          // The GPUI client ships no Intel macOS build.
          const requiredGpuiPlatforms = ["darwin-aarch64", "linux-x86_64", "windows-x86_64"];

          const missingAssets = requiredAssets.filter((asset) => !assets.has(asset));
          // Each GPUI entry must name this version and point at an asset of this release.
          const badGpuiPlatforms = requiredGpuiPlatforms.filter((platform) => {
            const entry = gpuiPlatforms[platform];
            return gpui.version !== version || !entry?.signature || !assets.has(String(entry.url).split("/").pop());
          });

          if (missingAssets.length > 0 || badGpuiPlatforms.length > 0) {
            throw new Error([
              missingAssets.length ? `missing assets: ${missingAssets.join(", ")}` : null,
              badGpuiPlatforms.length ? `missing GPUI platforms: ${badGpuiPlatforms.join(", ")}` : null,
            ].filter(Boolean).join("; "));
          }
          EOF

  publish-containers:
    name: Publish container images
    needs: stage-release-assets
    if: ${{ !cancelled() && !inputs.gpui-dry-run && needs.stage-release-assets.result == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download container images
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --pattern 'kubecove-container-*' --dir run-assets

      - name: Publish container images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          registry_image="ghcr.io/${GH_REPO,,}"
          version="${TAG_NAME#app-v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for variant in full slim; do
            suffix=""
            if [[ "$variant" == slim ]]; then suffix="-slim"; fi
            image="${registry_image}:${version}${suffix}"
            for arch in amd64 arm64; do
              docker load --input "run-assets/kubecove-container-${variant}-${arch}/kubecove-container-${variant}-${arch}.tar"
              docker tag "kubecove:release-${variant}-${arch}" "$image-${arch}"
              docker push "$image-${arch}"
            done
            # imagetools accepts per-arch pushes that are already indexes, such as BuildKit attestations.
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          done

  publish:
    name: Publish release
    needs:
      - prepare
      - metadata
      - publish-containers
    if: >-
      ${{ !cancelled() && !inputs.gpui-dry-run
          && needs.prepare.result == 'success' && needs.publish-containers.result == 'success'
          && needs.metadata.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish completed release
        if: needs.prepare.outputs.release-draft == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false --prerelease=false
