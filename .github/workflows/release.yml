name: Release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      # `gh workflow run release.yml --ref <branch> -f gpui-dry-run=true` builds, signs and
      # verifies the GPUI bundles as workflow artifacts. Every other job carries
      # `!inputs.gpui-dry-run`, so the dry run never reads a release or treats the branch as a tag.
      gpui-dry-run:
        description: Only build, sign and verify the GPUI client bundles; touch no release.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-draft: ${{ steps.release.outputs.release-draft }}
      release-exists: ${{ steps.release.outputs.release-exists }}

    steps:
      - name: Detect existing release state
        id: release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if release_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>release-error.txt)"; then
            echo "release-draft=$release_draft" >> "$GITHUB_OUTPUT"
            echo "release-exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE "not found|404" release-error.txt; then
            echo "release-draft=true" >> "$GITHUB_OUTPUT"
            echo "release-exists=false" >> "$GITHUB_OUTPUT"
          else
            cat release-error.txt >&2
            exit 1
          fi

  metadata:
    name: Release metadata
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-body: ${{ steps.release_body.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Validate release tag and versions
        env:
          TAG_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bun scripts/validate-release-tag.ts

      - name: Read release notes
        id: release_body
        shell: bash
        run: |
          {
            echo "body<<EOF"
            bun scripts/release-body.ts
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend release checks
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsparallel
      - parallel:
          - name: Check documentation
            run: bun run docs:check

          - name: Test release orchestration
            run: node --test scripts/release-workflow-regression.test.mjs

          - name: Typecheck frontend
            run: bun run typecheck

          - name: Lint frontend
            run: bun run lint

      # Svelte compilation tests need the runner after the parallel checks finish.
      - name: Test frontend
        run: bun test

  rust:
    name: Rust release checks
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache action never updates the package lists on a hosted runner. A list older than
      # the archive asks for package versions the mirror has dropped, the install fails with 404,
      # and the action then saves an empty cache.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install Linux Tauri dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            libayatana-appindicator3-dev
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            patchelf
          version: release-verify-tauri-linux-v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.29.2"
          working-directory: src-tauri
          cache-generation: kubecove-rust-ci

      - name: Test Rust
        run: mbx test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: mbx clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  e2e:
    name: Kubernetes ${{ matrix.kubernetes }} release E2E
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34", "1.35", "1.36", "1.37"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See the note on the same step in the rust job.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            dbus
            dbus-x11
            gnome-keyring
            libayatana-appindicator3-dev
            libsecret-1-0
            libwebkit2gtk-4.1-dev
            librsvg2-dev
            libssl-dev
            patchelf
            xvfb
          version: release-e2e-tauri-linux-v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The key, the cache settings and CARGO_PROFILE_DEV_DEBUG match e2e.yml, whose push job
      # saves this cache on main. A tag run restores it and never saves.
      - name: Key the Rust cache by its inputs
        id: rust-cache
        run: node scripts/ci-rust-cache-key.mjs e2e .github/workflows/e2e.yml e2e/lifecycle.ts src-tauri ':!src-tauri/gpui'

      - name: Setup Mr Boxington
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: src-tauri
          cache-key: ${{ steps.rust-cache.outputs.key }}
          restore-keys: ${{ steps.rust-cache.outputs.prefix }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fast suite
        run: bun run e2e:fast

      - name: Run real suite
        run: |
          dbus-run-session -- bash -euc '
            set -o pipefail
            if ! keyring_env="$(gnome-keyring-daemon --start --components=secrets)"; then
              echo "Failed to start gnome-keyring-daemon"
              exit 1
            fi
            eval "$keyring_env"
            dbus-send --session --print-reply \
              --dest=org.freedesktop.secrets \
              /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.SetAlias \
              string:default \
              objpath:/org/freedesktop/secrets/collection/session
            exec xvfb-run -a bun run e2e:real -- --kubernetes "${{ matrix.kubernetes }}" --provider docker
          '

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-e2e-${{ matrix.kubernetes }}-${{ github.run_id }}
          path: |
            e2e/artifacts/**
            .artifacts/e2e/**
          if-no-files-found: ignore

  server-packaging:
    name: Server packaging
    needs: metadata
    if: ${{ !inputs.gpui-dry-run }}
    uses: ./.github/workflows/server-packaging.yml
    permissions:
      contents: read
    with:
      release-tag: ${{ github.ref_name }}

  # The only job a GPUI dry run starts. It gets read-only contents and uploads workflow
  # artifacts; publish uploads them to the release. A dry run passes no tag, so the
  # manifest points at app-v<version> instead of the branch name.
  gpui:
    name: GPUI client bundles
    needs: metadata
    if: ${{ !cancelled() && (inputs.gpui-dry-run || needs.metadata.result == 'success') }}
    uses: ./.github/workflows/gpui-release.yml
    permissions:
      contents: read
    with:
      release-tag: ${{ !inputs.gpui-dry-run && github.ref_name || '' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  nix:
    name: Nix ${{ matrix.label }} release build
    if: ${{ !inputs.gpui-dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: ubuntu-latest
          - label: Linux arm64
            platform: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      # Enable with a Cachix cache, as in ci.yml.
      # - name: Use the Cachix cache
      #   uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      #   with:
      #     name: <cache name>
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build KubeCove
        run: nix build .#kubecove --print-build-logs

  verify:
    name: Verify release inputs
    needs:
      - metadata
      - frontend
      - rust
      - e2e
      - server-packaging
    if: ${{ always() && !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SERVER_PACKAGING_RESULT: ${{ needs.server-packaging.result }}
        run: |
          set -euo pipefail
          echo "Release metadata: ${METADATA_RESULT}"
          echo "Frontend release checks: ${FRONTEND_RESULT}"
          echo "Rust release checks: ${RUST_RESULT}"
          echo "Kubernetes E2E matrix: ${E2E_RESULT}"
          echo "Server and container packaging: ${SERVER_PACKAGING_RESULT}"
          test "${METADATA_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${RUST_RESULT}" = "success"
          test "${E2E_RESULT}" = "success"
          test "${SERVER_PACKAGING_RESULT}" = "success"

  draft:
    name: Create draft release
    needs:
      - prepare
      - metadata
      - verify
    if: ${{ !inputs.gpui-dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create release before asset builds
        if: needs.prepare.outputs.release-draft == 'true' && needs.prepare.outputs.release-exists != 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.metadata.outputs.release-body }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#app-v}"
          printf '%s\n' "$RELEASE_BODY" > release-notes.md
          gh release create "$TAG_NAME" \
            --title "KubeCove v${version}" \
            --notes-file release-notes.md \
            --draft \
            --verify-tag

  build:
    name: Build ${{ matrix.label }}
    needs:
      - prepare
      - metadata
      - verify
      - draft
    if: ${{ !inputs.gpui-dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
            expected-updater-assets: "KubeCove___VERSION___universal.app.tar.gz KubeCove___VERSION___universal.app.tar.gz.sig"
          - label: Windows x64
            platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust-targets: "x86_64-pc-windows-msvc"
            expected-updater-assets: "KubeCove___VERSION___x64-setup.exe KubeCove___VERSION___x64-setup.exe.sig"
          - label: Linux x64
            platform: ubuntu-latest
            args: "--target x86_64-unknown-linux-gnu"
            rust-targets: "x86_64-unknown-linux-gnu"
            expected-updater-assets: "KubeCove___VERSION___amd64.AppImage KubeCove___VERSION___amd64.AppImage.sig"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See the note on the same step in the rust job.
      - name: Refresh apt package lists
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential
            file
            libayatana-appindicator3-dev
            libfuse2
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            patchelf
            rpm
          version: release-build-tauri-linux-v1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust targets
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.29.2"
          backend: local

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare universal kubeconform sidecar
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          lipo -create \
            src-tauri/bin/kubeconform-aarch64-apple-darwin \
            src-tauri/bin/kubeconform-x86_64-apple-darwin \
            -output src-tauri/bin/kubeconform-universal-apple-darwin
          chmod 755 src-tauri/bin/kubeconform-universal-apple-darwin

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KUBECOVE_PUBLIC_RELEASE_CHANNEL: stable
        with:
          tagName: app-v__VERSION__
          releaseName: "KubeCove v__VERSION__"
          releaseBody: ${{ needs.metadata.outputs.release-body }}
          releaseDraft: ${{ needs.prepare.outputs.release-draft }}
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify release assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_UPDATER_ASSETS: ${{ matrix.expected-updater-assets }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#app-v}"
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' > release-assets.txt

          for asset_template in $EXPECTED_UPDATER_ASSETS; do
            asset="${asset_template//__VERSION__/$version}"
            grep -qx "$asset" release-assets.txt
          done

  publish:
    name: Publish release
    needs:
      - prepare
      - verify
      - build
      - server-packaging
      - gpui
    if: ${{ !inputs.gpui-dry-run }}
    permissions:
      actions: read
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download release build artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --dir run-assets

      - name: Upload headless server release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" run-assets/kubecove-server-*/kubecove-server_* --clobber

      # Signed and verified in gpui-release.yml: the GPUI bundles, their `.sig` files and latest-gpui.json.
      - name: Upload GPUI release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" run-assets/kubecove-gpui-release/* --clobber

      - name: Verify final updater platform coverage
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#app-v}"
          tmp="$(mktemp -d)"
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' > "$tmp/assets.txt"
          gh release download "$TAG_NAME" --pattern latest.json --pattern latest-gpui.json --clobber --dir "$tmp"
          UPDATER_CHECK_DIR="$tmp" RELEASE_VERSION="$version" node <<'EOF'
          const { readFileSync } = require("node:fs");

          const dir = process.env.UPDATER_CHECK_DIR;
          const version = process.env.RELEASE_VERSION;
          const assets = new Set(readFileSync(`${dir}/assets.txt`, "utf8")
            .split(/\r?\n/)
            .filter(Boolean));
          const latest = JSON.parse(readFileSync(`${dir}/latest.json`, "utf8"));
          const platforms = latest.platforms ?? {};
          const gpui = JSON.parse(readFileSync(`${dir}/latest-gpui.json`, "utf8"));
          const gpuiPlatforms = gpui.platforms ?? {};

          const requiredAssets = [
            `KubeCove_${version}_universal.app.tar.gz`,
            `KubeCove_${version}_universal.app.tar.gz.sig`,
            `KubeCove_${version}_amd64.AppImage`,
            `KubeCove_${version}_amd64.AppImage.sig`,
            `KubeCove_${version}_x64-setup.exe`,
            `KubeCove_${version}_x64-setup.exe.sig`,
            ...["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"].flatMap((target) =>
              ["", "-slim"].flatMap((suffix) => {
                const archive = `kubecove-server_${version}_${target}${suffix}.tar.gz`;
                return [archive, `${archive}.sha256`];
              })),
            ...[`kubecove-gpui_${version}_aarch64.app.tar.gz`, `kubecove-gpui_${version}_x86_64.AppImage`,
              `kubecove-gpui_${version}_x64-setup.exe`].flatMap((bundle) => [bundle, `${bundle}.sig`]),
            `kubecove-gpui_${version}_aarch64.dmg`,
            "latest.json",
            "latest-gpui.json",
          ];
          const requiredPlatforms = [
            "darwin-aarch64",
            "darwin-x86_64",
            "linux-x86_64",
            "linux-x86_64-appimage",
            "windows-x86_64",
            "windows-x86_64-nsis",
          ];
          // The GPUI client ships no Intel macOS build.
          const requiredGpuiPlatforms = ["darwin-aarch64", "linux-x86_64", "windows-x86_64"];

          const missingAssets = requiredAssets.filter((asset) => !assets.has(asset));
          const missingPlatforms = requiredPlatforms.filter((platform) => !platforms[platform]);
          // Each GPUI entry must name this version and point at an asset of this release.
          const badGpuiPlatforms = requiredGpuiPlatforms.filter((platform) => {
            const entry = gpuiPlatforms[platform];
            return gpui.version !== version || !entry?.signature || !assets.has(String(entry.url).split("/").pop());
          });

          if (missingAssets.length > 0 || missingPlatforms.length > 0 || badGpuiPlatforms.length > 0) {
            throw new Error([
              missingAssets.length ? `missing assets: ${missingAssets.join(", ")}` : null,
              missingPlatforms.length ? `missing platforms: ${missingPlatforms.join(", ")}` : null,
              badGpuiPlatforms.length ? `missing GPUI platforms: ${badGpuiPlatforms.join(", ")}` : null,
            ].filter(Boolean).join("; "));
          }
          EOF

      - name: Publish container images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          registry_image="ghcr.io/${GH_REPO,,}"
          version="${TAG_NAME#app-v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for variant in full slim; do
            suffix=""
            if [[ "$variant" == slim ]]; then suffix="-slim"; fi
            image="${registry_image}:${version}${suffix}"
            for arch in amd64 arm64; do
              docker load --input "run-assets/kubecove-container-${variant}-${arch}/kubecove-container-${variant}-${arch}.tar"
              docker tag "kubecove:release-${variant}-${arch}" "$image-${arch}"
              docker push "$image-${arch}"
            done
            # imagetools accepts per-arch pushes that are already indexes, such as BuildKit attestations.
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          done

      - name: Publish completed release
        if: needs.prepare.outputs.release-draft == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false --prerelease=false
