name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The Nix lock refresh workflow dispatches CI on its pull request branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      frontend: ${{ steps.detect.outputs.frontend }}
      nix: ${{ steps.detect.outputs.nix }}
      rust: ${{ steps.detect.outputs.rust }}
      matrix: ${{ steps.detect.outputs.matrix }}

    # No working tree or full-history fetch on the critical path.
    timeout-minutes: 3
    steps:
      - name: Detect relevant changes
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const required = { docs: false, frontend: false, nix: false, rust: false };
            const all = () => Object.keys(required).forEach((key) => { required[key] = true; });
            try {
              const pr = context.payload.pull_request;
              const base = pr?.base?.sha ?? context.payload.before;
              const head = pr?.head?.sha ?? context.sha;
              const sha = /^[a-f0-9]{40}$/i;
              if (!['pull_request', 'push'].includes(context.eventName) ||
                  !sha.test(base ?? '') || /^0+$/.test(base) || !sha.test(head ?? '') || /^0+$/.test(head) ||
                  context.payload.forced) {
                throw new Error('No safe immutable comparison; running all checks.');
              }

              // Immutable SHAs avoid races with new pushes or a changing PR file list.
              // Page 1 contains ALL changed files (up to 300), even with per_page: 1.
              const { data } = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                ...context.repo, basehead: `${base}...${head}`, per_page: 1, page: 1,
                request: { timeout: 15000 },
              });
              if (data.base_commit?.sha !== base || !sha.test(data.merge_base_commit?.sha ?? '') ||
                  !['ahead', 'identical', 'diverged'].includes(data.status) ||
                  !Array.isArray(data.files) || data.files.length >= 300 ||
                  (data.status === 'identical' && (base !== head || data.files.length !== 0))) {
                throw new Error('Comparison is incomplete or unverified; running all checks.');
              }
              // PRs use their merge base. Pushes must compare the exact before/after trees.
              if (!pr && data.merge_base_commit.sha !== base) {
                throw new Error('Non-fast-forward push; running all checks.');
              }

              for (const file of data.files) {
                if (!file || typeof file.filename !== 'string' || !file.filename ||
                    (file.status === 'renamed' && !file.previous_filename)) {
                  throw new Error('Incomplete file metadata; running all checks.');
                }
                for (const path of [file.filename, file.previous_filename].filter((value) => value !== undefined)) {
                  if (typeof path !== 'string' || !path) throw new Error('Invalid changed path.');
                  // Workflow and shared action changes must validate the pipeline itself.
                  if (path.startsWith('.github/') || path === 'scripts/ci-mbx-cargo.mjs') { all(); continue; }
                  const scope = {
                    docs: /\.md$|^docs\//i.test(path),
                    frontend: /\.(css|html|js|jsx|json|mjs|cjs|svelte|ts|tsx|mts|cts)$|(^|\/)bun\.lock$|^(src|public|e2e|scripts)\//i.test(path),
                    rust: /\.rs$|(^|\/)(Cargo\.(lock|toml)|rust-toolchain(\.toml)?)$|(^|\/)\.cargo\/|^src-tauri\//i.test(path),
                    nix: /\.nix$|(^|\/)(Cargo\.(lock|toml)|flake\.lock|bun\.lock|package\.json|vite\.config\.ts|svelte\.config\.js)$/i.test(path),
                  };
                  // Unknown paths fail toward more coverage, never a silently green gate.
                  if (!Object.values(scope).some(Boolean)) all();
                  for (const key of Object.keys(required)) required[key] ||= scope[key];
                }
              }
            } catch (error) {
              core.warning(`Change detection fallback: ${error instanceof Error ? error.message : "comparison failed"}`);
              all();
            }
            for (const [key, value] of Object.entries(required)) core.setOutput(key, String(value));
            // The owner budgets seven concurrent CI jobs. Every selected task runs in
            // one matrix, with no fail-fast cancellation of the other checks.
            const tasks = [
              { task: 'docs', scope: 'docs' },
              { task: 'frontend-e2e', scope: 'frontend' },
              { task: 'rust-test', scope: 'rust', workspace: 'src-tauri' },
              { task: 'rust-clippy', scope: 'rust', workspace: 'src-tauri' },
              { task: 'gpui-clippy', scope: 'rust', workspace: 'src-tauri/gpui' },
              { task: 'gpui-test', scope: 'rust', workspace: 'src-tauri/gpui' },
              { task: 'server-backend', scope: 'server', workspace: 'src-tauri' },
              { task: 'server-test', scope: 'server', workspace: 'src-tauri/server' },
              { task: 'server-api', scope: 'server', workspace: 'src-tauri/server' },
              { task: 'server-runtime', scope: 'server', workspace: 'src-tauri/server' },
            ];
            const include = tasks.filter(({ scope }) => scope === 'server'
              ? required.frontend || required.rust : required[scope]);
            core.setOutput('matrix', JSON.stringify({ include }));

  frontend:
    name: Frontend checks
    needs:
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test CI orchestration
        run: node --test scripts/ci-workflow-regression.test.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsparallel
      - parallel:
          - name: Test release orchestration
            run: node --test scripts/release-workflow-regression.test.mjs

          - name: Audit frontend dependencies
            run: bun run audit

          - name: Check documentation
            run: bun run docs:check

          - name: Typecheck frontend
            run: bun run typecheck

          - name: Typecheck benchmark fixtures
            run: bun run typecheck:bench

          - name: Check Svelte frontend
            run: bun run svelte:check

          - name: Lint frontend
            run: bun run lint

          - name: Lint frontend anti-slop rules
            run: bun run lint:anti-slop

      # Svelte compilation tests need the runner after the parallel checks finish.
      - name: Test frontend
        run: bun test

      - name: Test Svelte compiler integration
        run: bun run test:svelte


  checks:
    name: CI ${{ matrix.task }}
    needs:
      - changes
    if: ${{ (needs.changes.outputs.docs == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    # Retain the existing Rust cold-cache allowance; this is not a timing target.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Owner's seven-job budget minus the independent frontend job.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.task == 'docs' && '0' || '1' }}

      - name: Verify Rust audit coverage
        if: ${{ matrix.task == 'rust-test' }}
        run: node --test --test-name-pattern="Rust dependency audits cover every checked-in lockfile with narrow exceptions" scripts/ci-workflow-regression.test.mjs

      - name: Setup Bun
        if: ${{ matrix.task == 'docs' || matrix.task == 'frontend-e2e' || matrix.task == 'server-test' || matrix.task == 'server-runtime' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun dependencies
        if: ${{ matrix.task == 'frontend-e2e' || matrix.task == 'server-test' || matrix.task == 'server-runtime' }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        if: ${{ matrix.task == 'frontend-e2e' || matrix.task == 'server-test' || matrix.task == 'server-runtime' }}
        run: bun install --frozen-lockfile

      - name: Check documentation
        if: ${{ matrix.task == 'docs' }}
        run: bun run docs:check

      - name: Check diff whitespace
        if: ${{ matrix.task == 'docs' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # Dispatched runs have no base; compare with main when it is available.
            if BASE_SHA=$(git merge-base origin/main "${HEAD_SHA}" 2>/dev/null); then
              echo "No available base commit; checking changes since main for whitespace."
            else
              echo "No available base commit; checking the entire tree for whitespace."
              BASE_SHA=$(git hash-object -w -t tree /dev/null)
            fi
          fi
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      # These packages are often already present on the hosted runner. Only
      # update apt and install when pkg-config cannot resolve the required set.
      - name: Install Tauri Linux dependencies
        if: ${{ matrix.task == 'rust-test' || matrix.task == 'rust-clippy' }}
        run: |
          if ! pkg-config --exists webkit2gtk-4.1 ayatana-appindicator3-0.1 librsvg-2.0 || ! command -v patchelf >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          fi

      - name: Install GPUI build dependencies
        if: ${{ matrix.task == 'gpui-clippy' || matrix.task == 'gpui-test' }}
        run: |
          if ! pkg-config --exists fontconfig xcb xkbcommon xkbcommon-x11; then
            sudo apt-get update
            sudo apt-get install -y libfontconfig-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
          fi

      - name: Setup Rust
        if: ${{ matrix.workspace }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      # Cargo 1.100 puts unit state under build/, which the pinned action's target
      # scanner skips. Objects transport exports completed mbx commands instead.
      # One action/store per job also avoids cross-workspace post-step pruning.
      - name: Setup Mr Boxington
        if: ${{ matrix.workspace }}
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          working-directory: ${{ matrix.workspace }}
          cache-generation: kubecove-ci-objects-${{ matrix.task }}
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
          save-on-pull-request: true

      - name: Activate Cargo caching
        if: ${{ matrix.workspace }}
        run: node scripts/ci-mbx-cargo.mjs

      - name: Install cargo-audit
        if: ${{ matrix.task == 'rust-test' }}
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2

      - name: Audit desktop Rust dependencies
        if: ${{ matrix.task == 'rust-test' }}
        # Owner: @Timpan4. Remove when stable Tauri resolves glib >=0.20.
        run: cargo-audit audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429

      - name: Audit GPUI Rust dependencies
        if: ${{ matrix.task == 'rust-test' }}
        run: cargo-audit audit --file src-tauri/gpui/Cargo.lock

      - name: Audit server Rust dependencies
        if: ${{ matrix.task == 'rust-test' }}
        # Owner: @Timpan4. Production uses this chain only for public-signature verification.
        # Remove after jsonwebtoken supports rsa >=0.10 and crypto-bigint >=0.7.6.
        run: cargo-audit audit --file src-tauri/server/Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387

      - name: Run fast end-to-end suite
        if: ${{ matrix.task == 'frontend-e2e' }}
        run: bun run e2e:fast

      - name: Test Rust
        if: ${{ matrix.task == 'rust-test' }}
        run: mbx test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        if: ${{ matrix.task == 'rust-clippy' }}
        run: mbx clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Lint GPUI
        if: ${{ matrix.task == 'gpui-clippy' }}
        run: mbx clippy --manifest-path src-tauri/gpui/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test GPUI
        if: ${{ matrix.task == 'gpui-test' }}
        run: mbx test --manifest-path src-tauri/gpui/Cargo.toml --locked --lib --test native

      - name: Build browser UI
        if: ${{ matrix.task == 'server-test' || matrix.task == 'server-runtime' }}
        env:
          KUBECOVE_PUBLIC_RUNTIME: web
        run: bun run build

      - name: Verify GUI-free dependency tree
        if: ${{ matrix.task == 'server-backend' }}
        run: |
          set -euo pipefail
          cargo tree --manifest-path src-tauri/server/Cargo.toml --locked --edges normal,build --prefix none > server-dependencies.txt
          if grep -E '^(tauri |tauri-|gtk |gtk-sys |webkit2gtk |wry )' server-dependencies.txt; then
            exit 1
          fi

      - name: Test GUI-free backend crates
        if: ${{ matrix.task == 'server-backend' }}
        run: mbx test --locked --workspace --no-default-features --manifest-path src-tauri/Cargo.toml

      - name: Test headless server
        if: ${{ matrix.task == 'server-test' }}
        run: mbx test --manifest-path src-tauri/server/Cargo.toml --locked

      - name: Verify API-only server
        if: ${{ matrix.task == 'server-api' }}
        run: |
          mbx test --manifest-path src-tauri/server/Cargo.toml --locked --no-default-features
          mbx clippy --manifest-path src-tauri/server/Cargo.toml --locked --no-default-features --all-targets -- -D warnings

      - name: Lint headless server
        if: ${{ matrix.task == 'server-test' }}
        run: mbx clippy --manifest-path src-tauri/server/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build headless server
        if: ${{ matrix.task == 'server-runtime' }}
        run: mbx build --manifest-path src-tauri/server/Cargo.toml --locked

      - name: Verify HTTP and WebSocket lifecycle
        if: ${{ matrix.task == 'server-runtime' }}
        run: bun e2e/headless-smoke.ts

      - name: Upload headless verification report
        if: ${{ always() && matrix.task == 'server-runtime' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-verification
          path: e2e/artifacts/headless/**
          if-no-files-found: error

  nix:
    name: Nix build
    needs:
      - changes
      - checks
    # PRs use the native checks; Nix packaging runs after merge or on dispatch.
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      # Without a binary cache every run builds KubeCove from source; its
      # dependencies still come from cache.nixos.org. To share builds between
      # runs, create a Cachix cache, add the CACHIX_AUTH_TOKEN secret, and
      # enable this step with the cache's name.
      # - name: Use the Cachix cache
      #   uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      #   with:
      #     name: <cache name>
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Dependabot bumps bun.lock without bun.nix. Dependabot-triggered builds
      # warn and use the regenerated bun.nix; the Nix lock refresh workflow
      # commits it daily.
      - name: Check that bun.nix matches bun.lock
        env:
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          nix run --inputs-from . bun2nix -- -o bun.nix
          if git diff --quiet -- bun.nix; then exit 0; fi
          message="bun.nix does not match bun.lock. Regenerate it with: nix run --inputs-from . bun2nix -- -o bun.nix"
          if [ "$DEPENDABOT" = true ]; then
            echo "::warning::$message"
          else
            echo "::error::$message"
            exit 1
          fi

      - name: Build the frontend, desktop app, and server dependencies
        run: nix build .#frontend .#kubecove .#kubecove-server.cargoDeps --print-build-logs

  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - frontend
      - checks
      - nix
    if: always()

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NIX_REQUIRED: ${{ github.event_name != 'pull_request' && needs.changes.outputs.nix == 'true' }}
          NIX_RESULT: ${{ needs.nix.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          echo "Change detection: ${CHANGES_RESULT}"
          echo "Frontend checks: ${FRONTEND_RESULT}"
          echo "Required CI tasks: ${CHECKS_RESULT}"
          echo "Nix build: ${NIX_RESULT}"
          test "${CHANGES_RESULT}" = "success"
          for required in "${DOCS_REQUIRED}" "${FRONTEND_REQUIRED}" "${RUST_REQUIRED}" "${NIX_REQUIRED}"; do
            [[ "${required}" == "true" || "${required}" == "false" ]]
          done
          if [[ "${RELEASE_PR}" == "true" ]]; then
            test "${FRONTEND_RESULT}" = "skipped"
            test "${CHECKS_RESULT}" = "skipped"
            test "${NIX_RESULT}" = "skipped"
          else
            verify_result() {
              local required="$1"
              local result="$2"
              if [[ "${required}" == "true" ]]; then
                test "${result}" = "success"
              else
                test "${required}" = "false"
                test "${result}" = "skipped"
              fi
            }
            checks_required=false
            if [[ "${DOCS_REQUIRED}" == "true" || "${FRONTEND_REQUIRED}" == "true" || "${RUST_REQUIRED}" == "true" ]]; then
              checks_required=true
            fi
            verify_result "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
            verify_result "${checks_required}" "${CHECKS_RESULT}"
            verify_result "${NIX_REQUIRED}" "${NIX_RESULT}"
          fi
