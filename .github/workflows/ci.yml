name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        run: bun run audit

      - name: Check documentation
        run: bun run docs:check

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Check Svelte frontend
        run: bun run svelte:check

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun test

      - name: Run fast end-to-end suite
        run: bun run e2e:fast

  rust:
    name: Rust checks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-rust-ci
          workspaces: "./src-tauri -> target"

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Owner: @Timpan4. Remove when stable Tauri resolves glib >=0.20.
          ignore: RUSTSEC-2024-0429

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  nix:
    name: Nix Rust vendor build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""

      - name: Build Rust vendor tree
        run: nix build .#kubecove.cargoDeps

  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend
      - nix
      - rust
    if: always()

    steps:
      - name: Verify required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NIX_RESULT: ${{ needs.nix.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          echo "Frontend checks: ${FRONTEND_RESULT}"
          echo "Nix Rust vendor build: ${NIX_RESULT}"
          echo "Rust checks: ${RUST_RESULT}"
          if [[ "${RELEASE_PR}" == "true" ]]; then
            test "${FRONTEND_RESULT}" = "skipped"
            test "${NIX_RESULT}" = "success"
            test "${RUST_RESULT}" = "skipped"
          else
            test "${FRONTEND_RESULT}" = "success"
            test "${NIX_RESULT}" = "success"
            test "${RUST_RESULT}" = "success"
          fi
