name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      frontend: ${{ steps.detect.outputs.frontend }}
      nix: ${{ steps.detect.outputs.nix }}
      rust: ${{ steps.detect.outputs.rust }}

    # No working tree or full-history fetch on the critical path.
    timeout-minutes: 3
    steps:
      - name: Detect relevant changes
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const required = { docs: false, frontend: false, nix: false, rust: false };
            const all = () => Object.keys(required).forEach((key) => { required[key] = true; });
            try {
              const pr = context.payload.pull_request;
              const base = pr?.base?.sha ?? context.payload.before;
              const head = pr?.head?.sha ?? context.sha;
              const sha = /^[a-f0-9]{40}$/i;
              if (!['pull_request', 'push'].includes(context.eventName) ||
                  !sha.test(base ?? '') || /^0+$/.test(base) || !sha.test(head ?? '') || /^0+$/.test(head) ||
                  context.payload.forced) {
                throw new Error('No safe immutable comparison; running all checks.');
              }

              // Immutable SHAs avoid races with new pushes or a changing PR file list.
              // Page 1 contains ALL changed files (up to 300), even with per_page: 1.
              const { data } = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                ...context.repo, basehead: `${base}...${head}`, per_page: 1, page: 1,
                request: { timeout: 15000 },
              });
              if (data.base_commit?.sha !== base || !sha.test(data.merge_base_commit?.sha ?? '') ||
                  !['ahead', 'identical', 'diverged'].includes(data.status) ||
                  !Array.isArray(data.files) || data.files.length >= 300 ||
                  (data.status === 'identical' && (base !== head || data.files.length !== 0))) {
                throw new Error('Comparison is incomplete or unverified; running all checks.');
              }
              // PRs use their merge base. Pushes must compare the exact before/after trees.
              if (!pr && data.merge_base_commit.sha !== base) {
                throw new Error('Non-fast-forward push; running all checks.');
              }

              for (const file of data.files) {
                if (!file || typeof file.filename !== 'string' || !file.filename ||
                    (file.status === 'renamed' && !file.previous_filename)) {
                  throw new Error('Incomplete file metadata; running all checks.');
                }
                for (const path of [file.filename, file.previous_filename].filter((value) => value !== undefined)) {
                  if (typeof path !== 'string' || !path) throw new Error('Invalid changed path.');
                  // Workflow and shared action changes must validate the pipeline itself.
                  if (path.startsWith('.github/')) { all(); continue; }
                  const scope = {
                    docs: /\.md$|^docs\//i.test(path),
                    frontend: /\.(css|html|js|jsx|json|mjs|cjs|svelte|ts|tsx|mts|cts)$|(^|\/)bun\.lock$|^(src|public|e2e|scripts)\//i.test(path),
                    rust: /\.rs$|(^|\/)(Cargo\.(lock|toml)|rust-toolchain(\.toml)?)$|(^|\/)\.cargo\/|^src-tauri\//i.test(path),
                    nix: /\.nix$|(^|\/)(Cargo\.(lock|toml)|flake\.lock|bun\.lock|package\.json|vite\.config\.ts|svelte\.config\.js)$/i.test(path),
                  };
                  // Unknown paths fail toward more coverage, never a silently green gate.
                  if (!Object.values(scope).some(Boolean)) all();
                  for (const key of Object.keys(required)) required[key] ||= scope[key];
                }
              }
            } catch (error) {
              core.warning(`Change detection fallback: ${error instanceof Error ? error.message : "comparison failed"}`);
              all();
            }
            for (const [key, value] of Object.entries(required)) core.setOutput(key, String(value));

  docs:
    name: Documentation checks
    needs:
      - changes
    if: ${{ needs.changes.outputs.docs == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # check-docs.ts uses only built-in modules; no dependency install/cache.
      - name: Check documentation
        run: bun run docs:check

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No available base commit; checking the entire tree for whitespace."
            BASE_SHA=$(git hash-object -w -t tree /dev/null)
          fi
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"

  frontend:
    name: Frontend checks
    needs:
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test CI orchestration
        run: node --test scripts/ci-workflow-regression.test.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test release orchestration
        run: node --test scripts/release-workflow-regression.test.mjs

      - name: Audit frontend dependencies
        run: bun run audit

      - name: Check documentation
        run: bun run docs:check

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Typecheck benchmark fixtures
        run: bun run typecheck:bench

      - name: Check Svelte frontend
        run: bun run svelte:check

      - name: Lint frontend
        run: bun run lint

      - name: Lint frontend anti-slop rules
        run: bun run lint:anti-slop

      - name: Test frontend
        run: bun test

      - name: Run fast end-to-end suite
        run: bun run e2e:fast

  rust:
    name: Rust checks
    needs:
      - changes
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: kubecove-rust-ci
          workspaces: "./src-tauri -> target"

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Owner: @Timpan4. Remove when stable Tauri resolves glib >=0.20.
          ignore: RUSTSEC-2024-0429

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  server:
    name: Headless server checks
    needs:
      - changes
    if: ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release/app-v') || !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "./src-tauri/server -> target"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build browser UI
        env:
          KUBECOVE_PUBLIC_RUNTIME: web
        run: bun run build
      - name: Verify GUI-free dependency tree
        run: |
          set -euo pipefail
          cargo tree --manifest-path src-tauri/server/Cargo.toml --locked --edges normal,build --prefix none > server-dependencies.txt
          if grep -E '^(tauri |tauri-|gtk |gtk-sys |webkit2gtk |wry )' server-dependencies.txt; then
            exit 1
          fi
      - name: Test headless server
        run: cargo test --manifest-path src-tauri/server/Cargo.toml --locked
      - name: Verify API-only server
        run: |
          cargo test --manifest-path src-tauri/server/Cargo.toml --locked --no-default-features
          cargo clippy --manifest-path src-tauri/server/Cargo.toml --locked --no-default-features --all-targets -- -D warnings
      - name: Lint headless server
        run: cargo clippy --manifest-path src-tauri/server/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build headless server
        run: cargo build --manifest-path src-tauri/server/Cargo.toml --locked
      - name: Verify HTTP and WebSocket lifecycle
        run: bun e2e/headless-smoke.ts
      - name: Upload headless verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-verification
          path: e2e/artifacts/headless/**
          if-no-files-found: error

  nix:
    name: Nix build
    needs:
      - changes
    if: ${{ needs.changes.outputs.nix == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      # Without a binary cache every run builds KubeCove from source; its
      # dependencies still come from cache.nixos.org. To share builds between
      # runs, create a Cachix cache, add the CACHIX_AUTH_TOKEN secret, and
      # enable this step with the cache's name.
      # - name: Use the Cachix cache
      #   uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      #   with:
      #     name: <cache name>
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Dependabot bumps bun.lock without bun.nix. Its pull requests only
      # warn here, and build with the regenerated bun.nix; the Nix lock
      # refresh workflow commits it daily.
      - name: Check that bun.nix matches bun.lock
        env:
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          nix run --inputs-from . bun2nix -- -o bun.nix
          if git diff --quiet -- bun.nix; then exit 0; fi
          message="bun.nix does not match bun.lock. Regenerate it with: nix run --inputs-from . bun2nix -- -o bun.nix"
          if [ "$DEPENDABOT" = true ]; then
            echo "::warning::$message"
          else
            echo "::error::$message"
            exit 1
          fi

      - name: Build the frontend, desktop app, and server dependencies
        run: nix build .#frontend .#kubecove .#kubecove-server.cargoDeps --print-build-logs

  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - docs
      - frontend
      - nix
      - rust
      - server
    if: always()

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NIX_REQUIRED: ${{ needs.changes.outputs.nix }}
          NIX_RESULT: ${{ needs.nix.result }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          set -euo pipefail
          echo "Change detection: ${CHANGES_RESULT}"
          echo "Documentation checks: ${DOCS_RESULT}"
          echo "Frontend checks: ${FRONTEND_RESULT}"
          echo "Nix Rust vendor build: ${NIX_RESULT}"
          echo "Rust checks: ${RUST_RESULT}"
          test "${CHANGES_RESULT}" = "success"
          if [[ "${RELEASE_PR}" == "true" ]]; then
            test "${DOCS_RESULT}" = "skipped"
            test "${FRONTEND_RESULT}" = "skipped"
            test "${NIX_RESULT}" = "success"
            test "${RUST_RESULT}" = "skipped"
            test "${SERVER_RESULT}" = "skipped"
          else
            verify_result() {
              local required="$1"
              local result="$2"
              if [[ "${required}" == "true" ]]; then
                test "${result}" = "success"
              else
                test "${required}" = "false"
                test "${result}" = "skipped"
              fi
            }

            verify_result "${DOCS_REQUIRED}" "${DOCS_RESULT}"
            verify_result "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
            verify_result "${NIX_REQUIRED}" "${NIX_RESULT}"
            verify_result "${RUST_REQUIRED}" "${RUST_RESULT}"
            if [[ "${FRONTEND_REQUIRED}" == "true" || "${RUST_REQUIRED}" == "true" ]]; then
              test "${SERVER_RESULT}" = "success"
            else
              test "${SERVER_RESULT}" = "skipped"
            fi
          fi
