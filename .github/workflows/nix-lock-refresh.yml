name: Nix lock refresh

# Keeps the Nix build working between releases. Dependabot bumps bun.lock but
# not bun.nix, and nothing bumps flake.lock. Once a day this workflow
# regenerates bun.nix, updates the flake inputs, builds both packages, and
# opens or updates one pull request with the result. A failed build opens no
# pull request; the failed run is the signal.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh flake.lock and bun.nix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      # Enable with a Cachix cache, as in ci.yml.
      # - name: Use the Cachix cache
      #   uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      #   with:
      #     name: <cache name>
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update the flake inputs
        run: nix flake update

      - name: Regenerate bun.nix
        run: nix run --inputs-from . bun2nix -- -o bun.nix

      - name: Build the frontend and the desktop app
        run: nix build .#frontend .#kubecove --print-build-logs

      # A pull request opened with the default token starts no workflows, so
      # CI would not run on it. NIX_LOCK_REFRESH_TOKEN, a fine-grained token
      # with contents and pull-request write access, avoids that.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.NIX_LOCK_REFRESH_TOKEN || github.token }}
          branch: chore/nix-lock-refresh
          delete-branch: true
          # The main ruleset requires signed commits; unsigned bot commits
          # block the merge.
          sign-commits: true
          commit-message: "chore(nix): refresh flake.lock and bun.nix"
          title: "chore(nix): refresh flake.lock and bun.nix"
          body: |
            Updates the flake inputs and regenerates bun.nix from bun.lock. The frontend and the desktop app built with these changes in the workflow run that opened this pull request.
          add-paths: |
            flake.lock
            bun.nix
