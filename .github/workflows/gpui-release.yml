name: GPUI release bundles

# Builds the native GPUI client into updater bundles, signs them with the updater key,
# verifies the signatures and writes `latest-desktop.json`. Called by release.yml. Everything
# leaves as workflow artifacts; this workflow cannot write to releases, and release.yml's
# stage-release-assets job uploads the `kubecove-gpui-release` artifact to the release.
on:
  workflow_call:
    inputs:
      release-tag:
        description: The app-v* tag the manifest URLs point at. Empty for a dry run.
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle GPUI ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            key: linux-x64
            platform: ubuntu-latest
            rust-targets: "x86_64-unknown-linux-gnu"
            bundle-target: x86_64-unknown-linux-gnu
            format: appimage
          # Apple silicon only; the GPUI client ships no Intel macOS build.
          - label: macOS arm64
            key: macos-arm64
            platform: macos-latest
            rust-targets: "aarch64-apple-darwin"
            bundle-target: aarch64-apple-darwin
            # The app bundle feeds the updater archive; the DMG is the first-install download.
            format: app,dmg
          - label: Windows x64
            key: windows-x64
            platform: windows-latest
            rust-targets: "x86_64-pc-windows-msvc"
            bundle-target: x86_64-pc-windows-msvc
            format: nsis

    runs-on: ${{ matrix.platform }}
    # The same limit as the Tauri installer builds in release.yml.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GPUI build dependencies from parity-suite.yml, plus `file` and FUSE 2, which the
      # Tauri AppImage build installs. linuxdeploy mounts its appimage plugin through FUSE.
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y file libfontconfig-dev libfuse2 libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Rust targets
        run: rustup target add ${{ matrix.rust-targets }}

      # A build-time tool only. Installed before Cargo caching takes over `cargo`.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Cache Rust
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: "1.30.0"
          backend: local

      - name: Activate Cargo caching
        run: node scripts/ci-mbx-cargo.mjs

      - name: Build GPUI client
        env:
          BUNDLE_TARGET: ${{ matrix.bundle-target }}
        run: |
          set -euo pipefail
          # cargo-packager reads the binary from target/<bundle target>/release.
          cargo build --locked --release --manifest-path rust/gpui/Cargo.toml --bin kubecove-gpui --target "$BUNDLE_TARGET"

      # ADR 0035: a release build has no E2E automation, so it refuses KUBECOVE_E2E=1 and
      # exits before it opens storage or a window.
      - name: Check the release build excludes E2E automation
        shell: bash
        env:
          BUNDLE_TARGET: ${{ matrix.bundle-target }}
        run: |
          set -uo pipefail
          binary="rust/gpui/target/$BUNDLE_TARGET/release/kubecove-gpui"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$binary.exe"; fi
          # The step's shell runs with errexit, which an `if` condition suspends, so the
          # expected nonzero exit is captured instead of ending the step.
          if output="$(KUBECOVE_E2E=1 "$binary" 2>&1)"; then status=0; else status=$?; fi
          if [ "$status" -eq 0 ] || [[ "$output" != *"KUBECOVE_E2E=1 requires the e2e Cargo feature"* ]]; then
            echo "The release build did not refuse KUBECOVE_E2E=1 (exit $status): $output"
            exit 1
          fi

      # The bundle settings live in `[package.metadata.packager]` of rust/gpui/Cargo.toml.
      - name: Verify the target kubeconform sidecar
        env:
          BUNDLE_TARGET: ${{ matrix.bundle-target }}
        run: |
          set -euo pipefail
          sidecar="rust/bin/kubeconform-$BUNDLE_TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then sidecar="$sidecar.exe"; fi
          "$sidecar" -v

      - name: Bundle GPUI client
        env:
          BUNDLE_TARGET: ${{ matrix.bundle-target }}
          FORMAT: ${{ matrix.format }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        # Leave APPIMAGE_EXTRACT_AND_RUN unset: with it, the extracted appimage plugin runs
        # appimagetool from another directory and it cannot find the AppDir.
        run: |
          set -euo pipefail
          # Verify the declared installer identity before signing artifacts for this feed.
          version="$(node -p 'require("./package.json").version')"
          channel_mode=""
          if [[ -z "$RELEASE_TAG" ]]; then channel_mode=--dry-run; fi
          EXPECTED_PRODUCT="$(node scripts/desktop-release-channel.mjs "$version" product "$channel_mode")"
          EXPECTED_ID="$(node scripts/desktop-release-channel.mjs "$version" identifier "$channel_mode")"
          export EXPECTED_PRODUCT EXPECTED_ID
          cargo metadata --no-deps --format-version 1 --manifest-path rust/gpui/Cargo.toml |
            node -e 'const packages = JSON.parse(require("node:fs").readFileSync(0)).packages;
              const bundle = packages.find(p => p.name === "kubecove-gpui").metadata.packager;
              if (bundle.identifier !== process.env.EXPECTED_ID || bundle.productName !== process.env.EXPECTED_PRODUCT)
                throw Error("Package identity does not match the release channel");'
          # cargo-packager resolves an existing --out-dir before it changes to the crate directory.
          out=rust/gpui/target/gpui-bundle
          mkdir -p "$out" gpui-updater
          cargo packager --manifest-path rust/gpui/Cargo.toml --release --target "$BUNDLE_TARGET" \
            --packages kubecove-gpui --formats "$FORMAT" --out-dir "$out"
          prefix="$(node scripts/desktop-release-channel.mjs "$version" prefix "$channel_mode")"
          product="$EXPECTED_PRODUCT"
          case "$FORMAT" in
            # AppImage and NSIS use the main executable name, even when the product changes.
            appimage)
              image="kubecove-gpui_${version}_x86_64.AppImage"
              (cd "$out" && "./$image" --appimage-extract usr/bin/kubeconform && squashfs-root/usr/bin/kubeconform -v)
              cp "$out/$image" "gpui-updater/${prefix}_${version}_x86_64.AppImage"
              ;;
            nsis)
              installer="kubecove-gpui_${version}_x64-setup.exe"
              cp "$out/$installer" "gpui-updater/${prefix}_${version}_x64-setup.exe"
              ;;
            # The updater archive holds the bundle at its root, as Tauri's `.app.tar.gz` does.
            # cargo-packager names the DMG after the product; rename it to match the other GPUI assets.
            app,dmg)
              "$out/$product.app/Contents/MacOS/kubeconform" -v
              tar -czf "gpui-updater/${prefix}_${version}_aarch64.app.tar.gz" -C "$out" "$product.app"
              cp "$out/${product}_${version}_aarch64.dmg" "gpui-updater/${prefix}_${version}_aarch64.dmg"
              ;;
          esac
          ls -l gpui-updater

      - name: Verify the installed Windows kubeconform sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $version = node -p 'require("./package.json").version'
          $channelMode = @()
          if (!$env:RELEASE_TAG) { $channelMode = @("--dry-run") }
          $prefix = node scripts/desktop-release-channel.mjs $version prefix @channelMode
          if ($LASTEXITCODE -ne 0) { throw "Could not select the desktop artifact prefix" }
          $installer = Resolve-Path "gpui-updater/${prefix}_${version}_x64-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP ("kubecove-gpui-" + [guid]::NewGuid())
          # NSIS requires /D last and unquoted, even when the path contains spaces.
          $install = Start-Process -FilePath $installer.Path -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "GPUI installer exited with code $($install.ExitCode)" }
          $sidecar = Join-Path $installDir "kubeconform.exe"
          if (!(Test-Path -LiteralPath (Join-Path $installDir "kubecove-gpui.exe") -PathType Leaf) -or
              !(Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "GPUI and kubeconform must both be installed in $installDir"
          }
          & $sidecar -v
          if ($LASTEXITCODE -ne 0) { throw "Installed kubeconform exited with code $LASTEXITCODE" }

      - name: Upload unsigned GPUI bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubecove-gpui-bundle-${{ matrix.key }}
          path: gpui-updater/*
          if-no-files-found: error

  # Signing happens once, here, so build runners never receive the updater key.
  sign:
    name: Sign GPUI bundles and write latest-desktop.json
    needs: bundle
    runs-on: ubuntu-latest
    # The same limit as the release publish job.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Test minisign and manifest verification with a disposable key
        run: node scripts/check-gpui-signing.mjs

      - name: Download GPUI bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kubecove-gpui-bundle-*
          path: gpui-release
          merge-multiple: true

      - name: Sign GPUI bundles
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          channel_mode=""
          if [[ -z "$RELEASE_TAG" ]]; then channel_mode=--dry-run; fi
          bash scripts/sign-gpui-release.sh gpui-release "$version" "$channel_mode"

      - name: Verify signatures and write latest-desktop.json
        env:
          ASSETS_DIR: gpui-release
          GH_REPO: ${{ github.repository }}
          NOTES_FILE: release-notes.md
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          bun scripts/release-body.ts "$(node -p 'require("./package.json").version')" > "$NOTES_FILE"
          node scripts/gpui-release-manifest.mjs
          ls -l gpui-release

      - name: Upload GPUI release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubecove-gpui-release
          path: gpui-release/*
          if-no-files-found: error
