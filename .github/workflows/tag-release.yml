name: Tag Release

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged release PR
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/app-v') && contains(github.event.pull_request.labels.*.name, 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout merged release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Create release tag
        env:
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GITHUB_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun scripts/tag-release.ts

      - name: Start release workflow
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="app-v$(node -p "require('./package.json').version")"
          gh workflow run release.yml --ref "$tag_name"
