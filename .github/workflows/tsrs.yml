name: Native tsrs checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsrs.yml
      - package.json
      - bun.lock
      - scripts/tsrs.ts
      - scripts/svelte-check.mjs
      - scripts/svelte-check-tsrs.integration.mjs
      - tsconfig*.json
  pull_request:
    paths:
      - .github/workflows/tsrs.yml
      - package.json
      - bun.lock
      - scripts/tsrs.ts
      - scripts/svelte-check.mjs
      - scripts/svelte-check-tsrs.integration.mjs
      - tsconfig*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: tsrs on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:bench
      - run: bun run svelte:check
      - run: bun run test:svelte
