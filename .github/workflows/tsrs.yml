name: Native tsrs checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsrs.yml
      - package.json
      - bun.lock
      - scripts/tsrs.ts
      - scripts/svelte-check-tsrs.integration.mjs
      - tools/patches/**
      - tsconfig*.json
  pull_request:
    paths:
      - .github/workflows/tsrs.yml
      - package.json
      - bun.lock
      - scripts/tsrs.ts
      - scripts/svelte-check-tsrs.integration.mjs
      - tools/patches/**
      - tsconfig*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-build:
    name: tsrs on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache tsrs source binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e/tools/tsrs/*/*/bin
          key: tsrs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tsrs.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run tsrs:build
      - run: bun run typecheck
      - run: bun run typecheck:bench
      - run: bun run svelte:check
      - run: bun run test:svelte
